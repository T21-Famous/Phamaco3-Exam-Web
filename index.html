font-size:clamp(32px,4.3vw,56px);line-height:1.2;letter-spacing:-1.8px;margin:22px 0}h2{font-size:25px;line-height:1.6;letter-spacing:-.3px}h3{margin:0 0 12px}p{margin:12px 0}.hero{border-bottom:1px solid var(--line);padding-bottom:30px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}.stat strong{display:block;font-size:32px;font-weight:650}.stat span{font-size:13px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow);margin:20px 0}.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{text-align:left;padding:22px;display:flex;gap:16px;border-radius:16px;align-items:center}.tile:hover{border-color:var(--accent);background:var(--soft)}.num{font-size:21px;color:var(--purple);font-weight:650}.tile strong{font-size:16px;display:block}.tile small{color:var(--muted)}select,input,textarea{border:1px solid var(--line);padding:11px;border-radius:12px;background:var(--paper);color:var(--ink);max-width:100%}.progress{height:6px;border-radius:20px;background:var(--line);margin:20px 0;overflow:hidden}.progress div{height:100%;background:var(--accent);transition:width .3s}.choices{display:grid;gap:12px;margin:24px 0}.choice{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 20px;line-height:1.6;width:100%;min-height:65px}.choice .letter{border:1px solid var(--line);border-radius:9px;min-width:34px;text-align:center;padding:4px;font-size:14px}.choice:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}.choice:disabled{opacity:1}.choice.correct{border:2px solid var(--good);color:var(--good)}.choice.wrong{border:2px solid var(--bad);color:var(--bad)}.feedback{border-left:4px solid var(--accent);background:var(--soft);padding:22px;border-radius:0 12px 12px 0;margin-top:20px;overflow-wrap:anywhere}a{color:var(--accent);overflow-wrap:anywhere}.feedback h3{color:var(--accent)}.feedback p{white-space:pre-wrap}.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;max-height:280px;overflow:auto;padding:8px}.navgrid button{padding:5px;min-height:42px;font-size:12px}.navgrid .done{background:var(--soft)}.navgrid .miss{color:var(--bad);border-color:var(--bad)}.navgrid .here{outline:2px solid var(--accent)}.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}details{margin:16px 0}summary{cursor:pointer;color:var(--accent)}.notice{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}.hidden{display:none!important}textarea{width:100%;min-height:110px;resize:vertical}.meter{font-size:60px;color:var(--accent);font-weight:750;line-height:1.2}.results-row{display:grid;grid-template-columns:1fr auto;gap:14px;border-bottom:1px solid var(--line);padding:14px 0}.menu-button{display:none}.footer{margin-top:40px;font-size:12px;color:var(--muted)}.empty{padding:30px;text-align:center}#toast{position:fixed;bottom:20px;right:20px;padding:12px 22px;background:var(--ink);color:var(--paper);border-radius:12px;z-index:3}@media(max-width:1050px){main{padding:24px}.layout{grid-template-columns:230px 1fr}.chapter-grid{grid-template-columns:1fr}}@media(max-width:760px){.layout{display:block}aside{display:none;border-bottom:1px solid var(--line)}aside.open{display:block}.menu-button{display:inline-block}main{padding:20px 16px 40px}.topbar{margin-bottom:24px}.stats{gap:8px}.stat{padding:14px 10px}.stat strong{font-size:26px}.card{padding:21px 17px}h2{font-size:21px}.choice{padding:14px 12px}.tag{font-size:11px}.nav{flex-wrap:wrap}h1{letter-spacing:-1px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const DATA={"chapters": ["Histamine and Antihistamine", "Antiasthmatics", "NSAIDs and Non Narcotic Analgesics", "Thyroid and Anti Thyroid Drugs", "Contraceptives", "Antidiabetic Drugs", "Clinical Toxicology", "Medication of Osteoporosis", "Antiseptics • Anticaries • Oral diseases", "Immunomodulators", "Precision Medicine & Pharmacogenomics", "Drug Use in Special Populations", "Drug Interaction", "Rational Drug Use (RDU)"], "items": [{"id": "q11", "source": "ข้อ 11", "chapter": 0, "question": "ข้อใดผิดเกี่ยวกับ histamine", "choices": ["เกิดจากปฏิกิริยา decarboxylation ของ histidine", "พบได้น้อยใน mast cell", "ทำหน้าที่เป็น neurotransmitter ในระบบประสาทส่วนกลาง", "พบได้ในพิษงูหรือพิษแมลง", "เป็นสาร autocoids"], "answer": "b. พบได้น้อยใน mast cell", "explanation": "ข้อความนี้ผิด เพราะ mast cell สะสม histamine มาก; a เป็นขั้นตอนสร้างจาก histidine; c เป็นสารสื่อประสาทในสมอง; d พบในพิษสัตว์บางชนิด; e เป็น autacoid ที่ออกฤทธิ์เฉพาะที่", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q12", "source": "ข้อ 12", "chapter": 0, "question": "Antibody ใดที่อยู่บน mast cell และเป็นตัวรับที่กระตุ้นการหลั่ง histamine", "choices": ["IgD", "IgE", "IgG", "IgM", "IgA"], "answer": "b. IgE", "explanation": "IgE จับ FcεRI บน mast cell เมื่อ antigen ทำให้ cross-link จึง degranulation; IgD เป็น receptor บน B cell; IgG เด่นในเลือดและภูมิระยะหลัง; IgM เด่นระยะแรก; IgA เด่นที่เยื่อบุ หมายเหตุ: ตัวรับจริงคือ FcεRI ส่วน IgE เป็น antibody ที่จับตัวรับนั้น", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q13", "source": "ข้อ 13", "chapter": 0, "question": "ข้อใดผิดเกี่ยวกับการออกฤทธิ์ทางเภสัชวิทยาของ histamine", "choices": ["หัวใจเต้นเร็วและแรง", "ทำให้หลอดเลือดคลายตัว", "สารน้ำออกจากหลอดเลือด", "เพิ่มการหลั่งกรดในกระเพาะอาหาร", "ทำให้หลอดลมขยาย"], "answer": "e. ทำให้หลอดลมขยาย", "explanation": "Histamine ผ่าน H1 ทำให้หลอดลมหด ไม่ใช่ขยาย; H2 เพิ่มอัตราและแรงบีบหัวใจ รวมทั้งกรดกระเพาะ; H1 ทำให้ endothelial NO เพิ่ม เกิดหลอดเลือดขยาย และเพิ่ม vascular permeability จึงบวม", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q14", "source": "ข้อ 14", "chapter": 0, "question": "ยาต้าน histamine ชนิดใดทำให้มีอาการง่วงนอนน้อยที่สุด", "choices": ["Dimenhydrinate", "Loratadine", "Triprolidine", "Chlorpheniramine", "Diphenhydramine"], "answer": "b. Loratadine", "explanation": "เป็น H1 รุ่นที่ 2 ผ่านสมองน้อย จึงง่วงน้อยกว่าตัวเลือกอื่น; Dimenhydrinate, Triprolidine, Chlorpheniramine และ Diphenhydramine เป็นรุ่นที่ 1 ทำให้ง่วงและมีฤทธิ์ anticholinergic เช่น ปากแห้ง", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q15", "source": "ข้อ 15", "chapter": 0, "question": "ยาต้าน histamine ชนิดใดที่ใช้รักษาโรคกรดไหลย้อนและแผลในกระเพาะอาหาร", "choices": ["Ranitidine", "Dimenhydrinate", "Chlorpheniramine", "Cetirizine", "Fexofenadine"], "answer": "a. Ranitidine", "explanation": "เป็น H2 antagonist ลดการหลั่งกรด; Dimenhydrinate และ Chlorpheniramine เป็น H1 รุ่นที่ 1; Cetirizine และ Fexofenadine เป็น H1 รุ่นที่ 2 ใช้ลดอาการแพ้ ไม่ใช่ลดกรด คำตอบนี้เป็นการจำแนกฤทธิ์ยาตามโจทย์เดิม", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q16", "source": "ข้อ 16", "chapter": 1, "question": "ข้อใดคือกลไกการออกฤทธิ์ของยา salbutamol ในการรักษาโรคหืด", "choices": ["ยับยั้ง PDE isoenzyme", "ยับยั้ง M3 receptors", "ยับยั้ง adenosine receptors", "กระตุ้น beta1-adrenergic receptors", "กระตุ้น beta2-adrenergic receptors"], "answer": "e. กระตุ้น beta2-adrenergic receptors", "explanation": "เป็น SABA กระตุ้น β2 ทำให้ cAMP เพิ่มและหลอดลมคลาย; การยับยั้ง PDE/adenosine สัมพันธ์กับ theophylline; ต้าน M3 เป็นยากลุ่ม ipratropium/tiotropium; β1 เด่นที่หัวใจ อาการไม่พึงประสงค์เด่นของ salbutamol คือมือสั่นและใจสั่น", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q17", "source": "ข้อ 17", "chapter": 1, "question": "ยาใดจัดเป็น long-acting muscarinic antagonists (LAMA) เพื่อควบคุมอาการกำเริบของโรคหืด", "choices": ["Theophylline", "Salmeterol", "Tiotropium", "Prednisone", "Ipratropium"], "answer": "c. Tiotropium", "explanation": "ต้าน muscarinic ออกฤทธิ์ยาว ลด bronchoconstriction จาก acetylcholine; Ipratropium เป็น SAMA; Salmeterol เป็น LABA; Theophylline เป็น methylxanthine; Prednisone เป็น corticosteroid ลดอักเสบ", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q18", "source": "ข้อ 18", "chapter": 1, "question": "ยาใดมีระยะเวลาการออกฤทธิ์นาน และมักอยู่ในรูปแบบสูตรผสมร่วมกับยา corticosteroid แบบสูดพ่น", "choices": ["Prednisolone", "Ipratropium", "Epinephrine", "Salmeterol", "Cromolyn"], "answer": "d. Salmeterol", "explanation": "เป็น LABA จับคู่ ICS เพื่อควบคุมหืด; Prednisolone เป็น steroid ชนิด systemic; Ipratropium เป็น SAMA; Epinephrine กระตุ้น α/β; Cromolyn เป็น mast-cell stabilizer LABA ไม่ใช้เดี่ยวเพื่อรักษาหืด", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q19", "source": "ข้อ 19", "chapter": 1, "question": "ยาขยายหลอดลมใดที่มีช่วงการรักษาแคบ และควรทำการตรวจติดตามระดับยาในเลือด", "choices": ["Prednisone", "Zileuton", "Ipratropium", "Theophylline", "Salmeterol"], "answer": "d. Theophylline", "explanation": "ระดับสูงทำให้คลื่นไส้ หัวใจเต้นผิดจังหวะ และชัก จึงต้องติดตามยา; Prednisone ลดอักเสบ; Zileuton ยับยั้ง 5-lipoxygenase; Ipratropium เป็น SAMA; Salmeterol เป็น LABA", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q20", "source": "ข้อ 20", "chapter": 1, "question": "การติดเชื้อราในช่องปาก (oropharyngeal candidiasis) เป็นอาการไม่พึงประสงค์ที่พบบ่อยของยาในข้อใด", "choices": ["Beclomethasone by aerosol", "Salbutamol by aerosol", "Ipratropium by inhaler", "Prednisone by mouth", "Theophylline in long-acting oral form"], "answer": "a. Beclomethasone by aerosol", "explanation": "ICS ตกค้างในปากและกดภูมิเฉพาะที่ จึงเกิดเชื้อรา; Salbutamol ขยายหลอดลมและทำให้มือสั่น; Ipratropium ทำให้ปากแห้ง; Prednisone กดภูมิทั้งร่างกายได้ แต่ความสัมพันธ์เฉพาะที่ในโจทย์เด่นกับ ICS; Theophylline เด่นเรื่องหัวใจเต้นผิดจังหวะและชัก", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q21", "source": "ข้อ 21", "chapter": 2, "question": "ข้อใดคือกลไกการออกฤทธิ์ของ NSAIDs", "choices": ["ยับยั้ง serotonergic descending pathway", "ยับยั้ง lipocortin activity", "ยับยั้ง cyclooxygenase-2 gene transcription", "ยับยั้ง cyclooxygenase-1 and 2 activity", "ยับยั้ง phospholipase A2 activity"], "answer": "d. ยับยั้ง cyclooxygenase-1 and 2 activity", "explanation": "NSAIDs ลด prostaglandin ผ่านการยับยั้งกิจกรรม COX; ไม่ใช่ยับยั้ง serotonergic pathway; steroid เพิ่ม lipocortin/annexin-1 และลด COX-2 transcription จึงลด PLA2 pathway ทางอ้อม ไม่ใช่ยับยั้ง lipocortin", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q22", "source": "ข้อ 22", "chapter": 2, "question": "ผู้ป่วยอายุ 15 ปี มีไข้เนื่องจากเป็นไข้หวัดใหญ่ กินยา aspirin เพื่อลดไข้ ข้อใดคืออาการไม่พึงประสงค์ที่ รุนแรงที่อาจเกิดขึ้น", "choices": ["Salicylism", "Nicolau’s syndrome", "Pneumonia", "Gastric bleeding", "Reye’s syndrome"], "answer": "e. Reye’s syndrome", "explanation": "เด็ก/วัยรุ่นติดไวรัสแล้วใช้ aspirin เสี่ยงตับผิดปกติร่วมสมองบวม; Salicylism เป็นพิษ salicylate มีหูอื้อ; Nicolau เป็นเนื้อตายหลังฉีดยา; Pneumonia ไม่ใช่ภาวะจำเพาะนี้; Gastric bleeding เกิดได้แต่ไม่ใช่ key ของเด็กติดไวรัส", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q23", "source": "ข้อ 23", "chapter": 2, "question": "หญิงตั้งครรภ์ 34 สัปดาห์ ได้รับยา mefenamic acid ข้อใดคืออาการไม่พึงประสงค์ที่อาจเกิดขึ้น", "choices": ["มารดาเกิด adrenal insufficiency", "มารดามีเลือดออกทางช่องคลอด", "ทารกเกิด premature ductus arteriosus", "ทารกเกิด patent ductus arteriosus", "คลอดก่อนกำหนด"], "answer": "c. ทารกเกิด premature ductus arteriosus [หมายถึง premature closure]", "explanation": "NSAID ลด prostaglandin ทำให้ ductus arteriosus ปิดก่อนกำหนด; patent ductus คือยังเปิด เป็นทิศทางตรงข้าม; adrenal insufficiency สัมพันธ์กับ glucocorticoid withdrawal; เลือดออกเกิดได้แต่ไม่ใช่ key; NSAID ไม่ใช่สาเหตุจำเพาะของคลอดก่อนกำหนด หมายเหตุ: ช้อยส์ c ขาดคำว่า closure [อ้างอิงตรวจสอบ 2]", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q24", "source": "ข้อ 24", "chapter": 2, "question": "ข้อใดคือกลไกการแพ้ยา NSAIDs แบบ pseudoallergy", "choices": ["ยับยั้ง lipoxygenase", "กระตุ้น IgG และ IgM", "กระตุ้น T cell", "กระตุ้น IgE", "ยับยั้ง cyclooxygenase-1"], "answer": "e. ยับยั้ง cyclooxygenase-1", "explanation": "COX-1 inhibition ทำให้สมดุล arachidonic acid เปลี่ยนไปทาง leukotrienes จึงเกิด bronchospasm/ลมพิษในผู้ไวต่อยา; ไม่ใช่ IgE-mediated; IgG/IgM และ T cell เป็นกลไกภูมิคุ้มกันคนละแบบ; ไม่ใช่การยับยั้ง lipoxygenase", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q25", "source": "ข้อ 25", "chapter": 2, "question": "เหตุใดผู้ที่ดื่มแอลกอฮอลล์เป็นประจำ จึงมีความเสี่ยงต่อการเกิดพิษจาก acetaminophen เพิ่มขึ้น", "choices": ["CYP2D6 induction : increase N-acetyl-p-benzoquinone imine", "Glycine depletion : reduce glutathione synthesis", "CYP2E1 induction : increase N-acetyl-p-benzoquinone imine", "CYP3A4 inhibition : increase plasma concentration of acetaminophen", "Glutamate depletion : reduce glutathione synthesis"], "answer": "c. CYP2E1 induction : increase NAPQI", "explanation": "ดื่มเรื้อรังกระตุ้น CYP2E1 ทำให้สร้าง NAPQI เพิ่ม และภาวะโภชนาการไม่ดีอาจลด glutathione; CYP2D6 ไม่ใช่ key; การขาด glycine/glutamate ไม่ใช่กลไกหลักที่โจทย์ต้องการ; CYP3A4 inhibition ไม่อธิบายการสร้าง NAPQI เพิ่มตามโจทย์", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q26", "source": "ข้อ 26", "chapter": 2, "question": "ข้อใดเป็น antidote สำหรับการรักษา acetaminophen toxicity", "choices": ["N-acetylcysteine", "Antacid", "Activated charcoal", "L-cysteine", "Glutathione"], "answer": "a. N-acetylcysteine", "explanation": "NAC ช่วยเติม glutathione เพื่อกำจัด NAPQI; Antacid ลดกรด; Activated charcoal ลดการดูดซึมในบางกรณีแต่ไม่ใช่ antidote; L-cysteine และ glutathione ไม่ใช่ยามาตรฐานที่โจทย์ถาม", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q27", "source": "ข้อ 27", "chapter": 2, "question": "ยาใดเหมาะสมสำหรับบรรเทาอาการปวดในผู้ป่วยที่มีโรคแผลในกระเพาะอาหารและโรคกล้ามเนื้อหัวใจ ขาดเลือด", "choices": ["Diclofenac และ ranitidine", "Piroxicam", "Celecoxib", "Acetaminophen และ ibuprofen", "Naproxen และ omeprazole"], "answer": "e. Naproxen และ omeprazole [คำตอบตามกรอบตัวเลือก]", "explanation": "Naproxen เป็น NSAID ที่มีความเสี่ยงลิ่มเลือดค่อนข้างต่ำเมื่อเทียบ NSAID บางตัว ส่วน omeprazole เป็น PPI ลดความเสี่ยงแผล; Diclofenac เสี่ยงหัวใจ; Piroxicam เสี่ยง GI; Celecoxib ยังมี CV risk; เพิ่ม ibuprofen ร่วม acetaminophen ไม่ได้แก้ความเสี่ยงแผล ไม่มี NSAID ใดปลอดภัยเด็ดขาดในโรคหัวใจ/แผลกระเพาะ", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q28", "source": "ข้อ 28", "chapter": 2, "question": "ผู้ป่วยรายหนึ่งเกิด acute myocardial infarction หลังจากกินยา diclofenac ติดต่อกัน 2 สัปดาห์ ข้อใดคือ กลไกของยา diclofenac ที่ทำให้เกิดอาการดังกล่าว", "choices": ["ยับยั้งการสร้าง PGI2 และ TXA2 ทำให้เกิด vasoconstriction", "ยับยั้งการสร้าง PGI2 แต่ไม่ยับยั้ง TXA2 ทำให้เกิด platelet aggregation", "กระตุ้นการหลั่ง angiotensin II ทำให้เกิด vasoconstriction", "ยับยั้งการสร้าง PGE2 ทำให้เกิด vasodilation", "ยับยั้งการสร้าง TXA2 แต่ไม่ยับยั้ง PGI2 ทำให้เกิด platelet aggregation"], "answer": "b. ลด PGI2 มากกว่าผลต่อ TXA2 ทำให้สมดุลเอื้อต่อลิ่มเลือด", "explanation": "PGI2 ขยายหลอดเลือดและต้านเกล็ดเลือด ส่วน TXA2 ช่วยเกล็ดเลือดเกาะกลุ่ม; การกด PGI2 จึงเอื้อลิ่มเลือด ข้อ b เป็นคำอธิบายย่อของข้อสอบ ไม่ควรตีความว่า diclofenac ไม่มีผลต่อ TXA2 เลย; c ไม่ใช่กลไกหลัก; d ลด PGE2 ไม่ทำให้ vasodilation ตามข้อความ; e กลับทิศทางต้านเกล็ดเลือด", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q29", "source": "ข้อ 29", "chapter": 2, "question": "ผู้ชายสูงอายุที่กินยา celecoxib เป็นระยะเวลานานอาจทำให้เกิดอาการไม่พึงประสงค์ข้อใด", "choices": ["Hyperglycemia", "Bone fracture", "Anemia", "Gynecomastia", "Peptic ulcer"], "answer": "b. Bone fracture", "explanation": "เอกสารฉบับที่แก้ไขระบุเฉลยนี้ แต่ไม่ได้ให้คำอธิบายเพิ่มเติม จึงไม่ใส่คำอธิบายเดิมที่ถูกลบกลับมา", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq", "keyed": true, "verification": "คำตอบ b เป็นเฉลยที่ระบุในเอกสาร ไม่ควรสรุปว่า bone fracture เป็นคำตอบเดียวที่ยืนยันได้จากโจทย์นี้ ฉลาก celecoxib ระบุทั้ง anemia และ GI ulceration/bleeding จึงยังมีตัวเลือกที่เป็นไปได้อื่น", "verificationUrl": "https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=34bef49c-eca1-4f17-9b1b-55900ac40829", "verificationLabel": "DailyMed: Celecoxib"}, {"id": "q30", "source": "ข้อ 30", "chapter": 2, "question": "หลังจากถอนฟัน ผู้ป่วยได้รับยา ibuprofen 400 mg กินครั้งละ 1 เม็ด วันละ 3 ครั้ง แต่ผู้ป่วยแจ้งว่าอาการ ปวดไม่ดีขึ้น ควรเพิ่มยาใดเพื่อบรรเทาอาการปวดให้ผู้ป่วยรายนี้", "choices": ["Etoricoxib", "Acetaminophen", "Meloxicam", "Indomethacin", "Naproxen"], "answer": "b. Acetaminophen", "explanation": "เพิ่มยาแก้ปวดคนละกลไกได้; Etoricoxib, Meloxicam, Indomethacin และ Naproxen เป็น NSAIDs เช่นกัน การใช้ NSAIDs ซ้อนกันเพิ่มพิษ GI/ไตโดยไม่ใช่แนวทางเพิ่มยาที่เหมาะสม", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q31", "source": "ข้อ 31", "chapter": 3, "question": "ข้อใดเป็นรูปแบบยาที่ใช้รักษา hypothyroidism", "choices": ["T4 สังเคราะห์", "T3 สังเคราะห์", "T4 สกัดจากธรรมชาติ", "T4 + T3 อัตราส่วน 10:1", "T4 + T3 อัตราส่วน 4:1"], "answer": "a. T4 สังเคราะห์", "explanation": "Levothyroxine เป็น synthetic T4 ใช้ทดแทนฮอร์โมนและเปลี่ยนเป็น T3 ที่เนื้อเยื่อ; T3 ออกฤทธิ์เร็วกว่าและแกว่งกว่า; สารสกัดธรรมชาติและสูตร T4/T3 ไม่ใช่ตัวเลือกมาตรฐานแรกตามโจทย์", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q32", "source": "ข้อ 32", "chapter": 3, "question": "Propylthiouracil มีกลไกการออกฤทธิ์ยับยั้งขั้นตอนใดที่ methimazole ไม่มี", "choices": ["Proteolysis", "Peripheral conversion", "Coupling reaction", "Organification", "Iodide trapping"], "answer": "b. Peripheral conversion", "explanation": "PTU ยับยั้งการเปลี่ยน T4 เป็น T3 ที่รอบนอกเพิ่มจากการยับยั้ง TPO; ทั้ง PTU/MMI ยับยั้ง organification และ coupling; ไม่ยับยั้ง iodide trapping เป็นหลัก และไม่หยุด proteolysis ของฮอร์โมนที่สะสมโดยตรง", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q33", "source": "ข้อ 33", "chapter": 3, "question": "Propranolol ใช้ร่วมกับยาต้านไทรอยด์ในการรักษา hyperthyroidism เพื่ออะไร", "choices": ["ยับยั้ง peripheral conversion", "ลดอาการใจสั่น", "ลด onset ของยาต้านไทรอยด์", "ลดผลข้างเคียงจากยาต้านไทรอยด์", "ทำลายเซลล์ของต่อมไทรอยด์"], "answer": "b. ลดอาการใจสั่น [คำตอบหลักตามเจตนาโจทย์]", "explanation": "β-blocker ลดใจสั่น มือสั่น และอาการ sympathetic; a เกิดได้โดยเฉพาะขนาดสูง จึงเป็นช้อยส์ที่มีส่วนถูกด้วย; ไม่ได้ลด onset ของ thioamide โดยตรง; ไม่ใช้ลดผลข้างเคียงยาต้านไทรอยด์ และไม่ทำลายเซลล์ไทรอยด์", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "review"}, {"id": "q34", "source": "ข้อ 34", "chapter": 3, "question": "ข้อใดถูกเกี่ยวกับยาต้านไทรอยด์ชนิด radioactive iodine", "choices": ["บริหารโดยการกิน", "ใช้ก่อนการทำ thyroidectomy", "ใช้กรณีหญิงตั้งครรภ์ไม่เกิน 3 เดือน", "ออกฤทธิ์ทำให้เกิด Wolff-Chaikoff block", "อาจทำให้เกิด hyperthyroidism"], "answer": "a. บริหารโดยการกิน", "explanation": "I-131 ให้ทางปากและทำลายเนื้อไทรอยด์ด้วยรังสี; ห้ามใช้ในหญิงตั้งครรภ์; Wolff-Chaikoff เป็นฤทธิ์ iodide ความเข้มข้นสูง ไม่ใช่กลไกหลักของ I-131; ผลระยะยาวเด่นคือ hypothyroidism ส่วน thyroid hormone อาจเพิ่มชั่วคราวได้ จึงทำให้ e ไม่ใช่คำตอบดีที่สุด", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q35", "source": "ข้อ 35", "chapter": 3, "question": "ผลไม่พึงประสงค์ที่รุนแรงของ thioamides คืออะไร", "choices": ["Goiter", "Agranulocytosis", "Arrhythmia", "Asthma", "Graves’ disease"], "answer": "b. Agranulocytosis", "explanation": "เม็ดเลือดขาวต่ำรุนแรงทำให้ติดเชื้อ เสี่ยงเมื่อมีไข้/เจ็บคอ; Goiter อาจเกิดเมื่อฮอร์โมนต่ำแล้ว TSH สูง; Arrhythmia สัมพันธ์กับ hyperthyroidism; Asthma/Graves ไม่ใช่อาการพิษจำเพาะของ thioamide", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q36", "source": "ข้อ 36", "chapter": 4, "question": "ผู้ป่วยหญิงมีประวัติใช้ยาคุมกำเนิดชนิดฮอร์โมนรวมมานาน 1 ปี เข้ารับการผ่าตัดทางทันตกรรม หลัง ผ่าตัดเกิดภาวะ deep vein thrombosis แพทย์คาดว่าอาจเป็นผลจากยาคุมกำเนิดที่ผู้ป่วยใช้ ข้อใดเป็น กลไกของยาคุมกำเนิดที่ทำให้เกิดภาวะดังกล่าว", "choices": ["Estrogen ปละ progestin - เพิ่มการสังเคราะห์ TXA2", "Progestin – เพิ่มการเกาะกลุ่มของเกล็ดเลือด", "Progestin - ลดการสร้าง anti-thrombin III", "Estrogen – เพิ่มการสร้าง clotting factor จากตับ", "Estrogen - เพิ่มการสร้าง hormone-binding globulin จากตับ"], "answer": "d. Estrogen เพิ่ม clotting factor จากตับ", "explanation": "Estrogen เปลี่ยนสมดุลการแข็งตัวของเลือดให้เอื้อลิ่มเลือด; การเพิ่ม hormone-binding globulin ไม่ใช่กลไกหลักของ DVT; ช้อยส์ TXA2/progestin ไม่ใช่คำอธิบายหลักตามโจทย์", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q37", "source": "ข้อ 37", "chapter": 4, "question": "ข้อใดคือกลไกการป้องกันการตั้งครรภ์ของยาคุมกำเนิดชนิดฮอร์โมนรวม", "choices": ["ทำให้ท่อนำไข่ตีบ", "ยับยั้งการหลั่ง FSH และ LH", "ทำให้เยื่อบุ endometrium หลุดลอก", "ทำให้เกิด cervix hypertrophy", "ทำลาย follicles ในรังไข่"], "answer": "b. ยับยั้งการหลั่ง FSH และ LH", "explanation": "Negative feedback ยับยั้ง follicular development และ LH surge จึงไม่ตกไข่; progestin ยังทำให้มูกปากมดลูกข้น; ไม่ได้ทำให้ท่อนำไข่ตีบ ไม่ทำลาย follicle และไม่อาศัย cervix hypertrophy", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q38", "source": "ข้อ 38", "chapter": 4, "question": "ผู้ป่วยที่ใช้ยาคุมกำเนิดชนิดฮอร์โมนรวมร่วมกับยา amoxicillin จะทำให้เกิดผลอย่างไร", "choices": ["การดูดซึมยา amoxicillin น้อยลง : ประสิทธิภาพการกำจัดเชื้อลดลง", "Amoxicillin แย่งจับ plasma albumin : ระดับยาคุมกำเนิดในพลาสมาสูงขึ้น", "Amoxicillin เหนี่ยวนำการสร้าง CYP3A4 : การ metabolism ของยาคุมกำเนิดเพิ่มขึ้น", "เอสโตรเจน ลด enterohepatic circulation ของ amoxicillin : เกิดการดื้อยา amoxicillin", "Amoxicillin ทำลาย GI normal flora : ประสิทธิภาพการคุมกำเนิดลดลง"], "answer": "e ตามเฉลยโพยเดิม แต่ข้อสรุปประสิทธิภาพคุมกำเนิดลดลงไม่รองรับโดยหลักฐานปัจจุบัน", "explanation": "โพยอธิบายว่า GI flora ลดทำให้ enterohepatic recycling ลด; อย่างไรก็ตาม amoxicillin ไม่ใช่ enzyme inducer และโดยทั่วไปไม่ลดประสิทธิภาพ CHC อย่างมีนัยสำคัญ จึงไม่มีช้อยส์ถูกสมบูรณ์ตามหลักปัจจุบัน; a/b/d ไม่ใช่ interaction หลัก และ c ผิดเพราะ amoxicillin ไม่เหนี่ยวนำ CYP3A4 [อ้างอิงตรวจสอบ 1]", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "review"}, {"id": "q39", "source": "ข้อ 39", "chapter": 4, "question": "ยาใดมีผลลดระดับฮอร์โมนคุมกำเนิดในเลือดอย่างมีนัยสำคัญ", "choices": ["Clarithromycin", "Tetracycline", "Rifampicin", "Hydrocortisone", "Metronidazole"], "answer": "c. Rifampicin", "explanation": "เหนี่ยวนำเอนไซม์ทำให้กำจัดฮอร์โมนเร็วขึ้น; Clarithromycin เป็น inhibitor; Tetracycline/Metronidazole ไม่ใช่ inducer สำคัญแบบ rifampicin; Hydrocortisone ไม่ใช่ key นี้ [อ้างอิงตรวจสอบ 1]", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q40", "source": "ข้อ 40", "chapter": 4, "question": "ข้อใดไม่ใช่อาการไม่พึงประสงค์ของยาคุมกำเนิดฮอร์โมนรวมต่อเนื้อเยื่อในปาก", "choices": ["Herpetic gingivostomatitis", "Gingivitis", "Gingival melanosis", "Gingival bleeding", "Increase some gingival microflora"], "answer": "a. Herpetic gingivostomatitis", "explanation": "เป็นโรคจาก HSV ไม่ใช่อาการไม่พึงประสงค์จำเพาะของยาคุม; ในบทเรียนฮอร์โมนสัมพันธ์กับ gingivitis เลือดออก สีเหงือก และการเปลี่ยน microflora บางชนิด", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q41", "source": "ข้อ 41", "chapter": 5, "question": "ข้อใดผิดเกี่ยวกับผู้ป่วยเบาหวานและการใช้ยารักษาโรคเบาหวาน", "choices": ["ผู้ที่มีระดับน้ำตาลในเลือดหลังอดอาหาร 8 ชั่วโมงเกิน 126 mg/dL ถือว่าเป็นเบาหวาน", "ผู้ป่วยเบาหวาน type 2 ทุกคนควรได้รับยาลดน้ำตาลในเลือดเพื่อควบคุมระดับน้ำตาลในเลือด ตั้งแต่ระยะเริ่มแรก", "ยาลดระดับน้ำตาลในเลือดสำหรับผู้ป่วยเบาหวาน type 2 ที่อ้วนควรเริ่มด้วย biguanide", "ผู้ป่วยเบาหวาน type 1 ควรได้รับการรักษาด้วย insulin", "การรักษาผู้ป่วยเบาหวาน type 2 มักใช้ยาลดน้ำตาลในเลือดชนิดรับประทาน"], "answer": "b ตามเฉลยโพยเดิม; ข้อความเชิงแนวทางต้องอ่านตามบริบท", "explanation": "โพยเน้นเริ่มปรับอาหารและออกกำลัง ไม่ใช่ให้ยาเหมือนกันทุกคน; อย่างไรก็ตามการเริ่มยาจริงขึ้นกับระดับน้ำตาล อาการ และโรคร่วม; Metformin เป็น biguanide ลดการสร้างกลูโคสตับ; type 1 ต้อง insulin; เกณฑ์ fasting glucose คือ ≥126 mg/dL และมักต้องยืนยันเมื่อไม่มีอาการชัด จึงทำให้ถ้อยคำ a ไม่ครบเช่นกัน", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "review"}, {"id": "q42", "source": "ข้อ 42", "chapter": 5, "question": "ข้อใดไม่ใช่ฤทธิ์ของ insulin", "choices": ["ยับยั้งการปล่อยกลูโคสออกมาจากตับ", "กระตุ้นการสร้างโปรตีนในเซลล์กล้ามเนื้อ", "กระตุ้นการนำกลูโคสเข้าสู่เซลล์", "กระตุ้นการสลายไขมัน", "ยับยั้งการสลายไกลโคเจน"], "answer": "d. กระตุ้นการสลายไขมัน", "explanation": "Insulin ยับยั้ง lipolysis และ ketogenesis; เพิ่ม glucose uptake ที่กล้ามเนื้อ/ไขมัน เพิ่ม protein synthesis ยับยั้ง hepatic glucose output และ glycogen breakdown", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q43", "source": "ข้อ 43", "chapter": 5, "question": "ผู้ป่วยเบาหวานที่ได้รับการรักษาด้วย insulin อาจเกิดอาการข้างเคียงต่อไปนี้ ยกเว้น", "choices": ["หิว", "เหงื่อออก", "ความดันโลหิตสูง", "ใจสั่น", "มือสั่น"], "answer": "c. ความดันโลหิตสูง", "explanation": "หิว เหงื่อออก ใจสั่น มือสั่น เป็นอาการเตือน hypoglycemia ที่เกิดจาก insulin ได้; ความดันสูงไม่ใช่อาการเด่นที่โจทย์ต้องการ แม้ sympathetic activation อาจเปลี่ยนความดันได้", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q44", "source": "ข้อ 44", "chapter": 5, "question": "ยาลดน้ำตาลในเลือดกลุ่ม sulfonylureas เช่น glibenclamide ออกฤทธิ์อย่างไร", "choices": ["กระตุ้นการหลั่งอินซูลินจากตับอ่อน", "ยับยั้งการเปลี่ยน disaccharide ไปเป็นกลูโคส", "กระตุ้นกระบวนการ anaerobic glycolysis", "ยับยั้งการดูดซึมกลูโคสในลำไส้", "เพิ่มการตอบสนองของเซลล์ต่ออินซูลิน"], "answer": "a. กระตุ้นการหลั่งอินซูลินจากตับอ่อน", "explanation": "จับ SUR1 ปิด KATP channel ทำให้ depolarization และ Ca2+ เข้า กระตุ้น β-cell หลั่ง insulin; ยับยั้งการย่อย disaccharide เป็น α-glucosidase inhibitor; เพิ่มความไว insulin เป็น TZD/metformin; anaerobic glycolysis ไม่ใช่กลไกหลัก", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q45", "source": "ข้อ 45", "chapter": 5, "question": "ยาใดใช้ลดระดับกลูโคสในเลือดสำหรับผู้หญิงมีครรภ์", "choices": ["Acarbose", "Insulin", "Repaglinide", "Pioglitazone", "Metformin"], "answer": "b. Insulin", "explanation": "เป็นคำตอบมาตรฐานในตัวเลือกสำหรับควบคุมเบาหวานระหว่างตั้งครรภ์; Acarbose ยับยั้ง α-glucosidase; Repaglinide กระตุ้น insulin; Pioglitazone เพิ่ม insulin sensitivity; Metformin ลด hepatic glucose output และอาจใช้บางบริบท แต่โจทย์เดิมต้องการ insulin", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q46", "source": "ข้อ 46", "chapter": 5, "question": "Insulin รูปแบบใดที่มีฤทธิ์แบบ long-acting", "choices": ["Aspart", "Regular", "Glargine", "Lispro", "Lente"], "answer": "c. Glargine, Ultralente, PZI", "explanation": "เป็น basal insulin ออกฤทธิ์ยาวและไม่มี peak เด่น; Aspart/Lispro เป็น rapid-acting; Regular เป็น short-acting; Lente จัด intermediate-acting ในการแบ่งแบบเดิม", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q47", "source": "ข้อ 47", "chapter": 5, "question": "ผู้ป่วยได้รับยาลดน้ำตาลในเลือดชนิดใดมีโอกาสเกิดภาวะน้ำตาลในเลือดต่ำ (hypoglycemia) มากที่สุด", "choices": ["Metformin", "Glibenclamide", "Pramlintide", "Pioglitazone", "Bromocriptine"], "answer": "b. Glibenclamide", "explanation": "Sulfonylurea กระตุ้น insulin แม้น้ำตาลเริ่มต่ำ จึงเสี่ยง hypoglycemia; Metformin และ Pioglitazone ไม่กระตุ้น insulin โดยตรง; Pramlintide เป็น amylin analog; Bromocriptine เป็น dopamine agonist ไม่ใช่ตัวเสี่ยงเด่นเท่า glibenclamide เมื่อใช้เดี่ยว", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q48", "source": "ข้อ 48", "chapter": 5, "question": "ข้อใดไม่ใช่ฤทธิ์ของ incretin mimetics เช่น exenatide", "choices": ["ทำให้ gastric emptying time ช้าลง", "ยับยั้งการหลั่งกลูคากอนจากตับอ่อน", "กระตุ้นการหลั่งอินซูลินจากตับอ่อน", "ทำให้ความอยากอาหารลดลง", "ทำให้ cardiac output ลดลง"], "answer": "e. ทำให้ cardiac output ลดลง", "explanation": "GLP-1 agonist เพิ่ม insulin แบบขึ้นกับ glucose ลด glucagon ชะลอ gastric emptying และลดความอยากอาหาร; ลด cardiac output ไม่ใช่ฤทธิ์หลักจำเพาะของกลุ่มนี้", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q49", "source": "ข้อ 49", "chapter": 5, "question": "ข้อใดถูกเกี่ยวกับกลไกการออกฤทธิ์ของยา dapagliflozin", "choices": ["ยับยั้งการทำงานของ dipeptidyl peptidase-4 (DPP-4)", "กระตุ้นการหลั่งอินซูลินจากตับอ่อน", "ยับยั้งการทำงานของ sodium-glucose transport protein", "ยับยั้งการทำงานของ -glucosidase", "ยับยั้งการทำงานของ ATP-sensitive K+ channel"], "answer": "c. ยับยั้ง sodium-glucose transport protein", "explanation": "ยับยั้ง SGLT2 ที่ proximal tubule ลดดูดกลับกลูโคส เพิ่มน้ำตาลในปัสสาวะ; a เป็น DPP-4 inhibitor; b/e เป็น insulin secretagogue; d เป็น α-glucosidase inhibitor", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q50", "source": "ข้อ 50", "chapter": 5, "question": "ผู้ป่วยหญิงอายุ 20 ปี ได้รับการวินิจฉัยว่าเป็นโรคเบาหวาน type 1 และมีฟันผุดังรูปร่วมด้วย ค่าระดับ น้ำตาลในเลือดหลังอดอาหารเท่ากับ 90 mg/dL ผู้ป่วยใช้ regular insulin (RI) ในการลดระดับน้ำตาลใน เลือด ทันตแพทย์ต้องการทำหัตถการโดยการถอนฟัน ข้อใดถูก เกี่ยวกับการรักษาผู้ป่วยรายนี้", "choices": ["ให้ผู้ป่วยอดอาหารเช้าและฉีดอินซูลินแล้วทำการถอนฟันทันที", "ให้ผู้ป่วยทานอาหารเช้าและฉีดอินซูลินแล้วทำการถอนฟันหลังผ่านไป 2 ชั่วโมง", "ให้ผู้ป่วยทานอาหารเช้าและฉีดอินซูลินแล้วทำการถอนฟันทันที", "ถอนฟันให้ผู้ป่วยได้ทันที", "ให้ผู้ป่วยอดอาหารเช้าและฉีดอินซูลินแล้วทำการถอนฟันหลังผ่านไป 2 ชั่วโมง"], "answer": "c. รับประทานอาหารเช้าและฉีด insulin ตามปกติ แล้วนัดทำช่วงเช้าที่หลีกเลี่ยง peak", "explanation": "โพยเลือก c และเน้นไม่อดอาหาร; RI มี peak ภายหลัง จึงไม่ควรตั้งใจนัดช่วงประมาณ 2 ชั่วโมงหลังฉีดตาม b; a/e เสี่ยง hypoglycemia จากฉีดยาขณะอดอาหาร; d ขาดการประเมินอาหารและยา หมายเหตุ: คำว่า “ทันที” ในช้อยส์เป็นกรอบข้อสอบ ต้องประเมินน้ำตาลและแผนยาจริงก่อนหัตถการ", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q51", "source": "ข้อ 51", "chapter": 8, "question": "สารใดที่มีคุณสมบัติเป็นได้ทั้ง antiseptic, disinfectant และ sterilant", "choices": ["Hydrogen peroxide", "Triclosan", "Formaldehyde", "Silver sulfadiazine", "Quaternary ammonium compounds"], "answer": "a. Hydrogen peroxide", "explanation": "ใช้ได้ต่างระดับตามความเข้มข้น รูปแบบ และเวลาสัมผัส; Triclosan เป็น antiseptic; Formaldehyde ใช้ disinfectant/sterilant แต่ระคายและไม่ใช่ antiseptic ที่เหมาะกับเนื้อเยื่อ; Silver sulfadiazine ใช้แผลไหม้; QAC ไม่ฆ่าสปอร์ จึงไม่ใช่ sterilant", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q52", "source": "ข้อ 52", "chapter": 8, "question": "สารในกลุ่มใดมีฤทธิ์ในการฆ่าเชื้อน้อยที่สุด", "choices": ["Alcohols", "Phenols", "Cationic surface-active agents", "Anionic surface-active agents", "Heavy metals"], "answer": "d. Anionic surface-active agents", "explanation": "สบู่ anionic เด่นที่ชะล้างและพาเชื้อออกมากกว่าฆ่าเชื้อ; Alcohol/Phenol ทำลายโปรตีนและเยื่อหุ้ม; Cationic surfactant เช่น QAC ฆ่าเชื้อได้บางกลุ่ม; Heavy metals จับโปรตีน/หมู่ sulfhydryl", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q53", "source": "ข้อ 53", "chapter": 8, "question": "สารใดมีคุณลักษณะใกล้เคียงกับ ideal antiseptic มากที่สุด", "choices": ["Phenol", "Povidone-iodine", "Glutaraldehyde", "Sodium hypochlorite", "Isopropanol"], "answer": "b. Povidone-iodine", "explanation": "Iodophor ปลดปล่อย iodine มี spectrum กว้างและใช้กับเนื้อเยื่อได้ตามรูปแบบ; Phenol ระคาย; Glutaraldehyde เหมาะกับเครื่องมือ; NaOCl ระคายเนื้อเยื่อ; Isopropanol ไม่ฆ่าสปอร์และใช้กับแผลเปิดมีข้อจำกัด ไม่มีสารใดเป็น ideal ทุกด้าน", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q54", "source": "ข้อ 54", "chapter": 8, "question": "สารใดที่ยังมีประสิทธิภาพในการฆ่าเชื้อได้ดี (ประสิทธิภาพไม่ลดลง) แม้จะใช้บริเวณที่มีเลือด ผู้ป่วย ปนเปื้อนอยู่", "choices": ["Sodium hypochlorite", "Iodophor", "Isopropanol", "Ethanol", "Glutaraldehyde"], "answer": "b. Iodophor มีตัวของ CHX ด้วย", "explanation": "เอกสารฉบับที่แก้ไขระบุเฉลยนี้ แต่ไม่ได้ให้คำอธิบายเพิ่มเติม จึงไม่ใส่คำอธิบายเดิมที่ถูกลบกลับมา", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq", "keyed": true, "verification": "เอกสารเลือก b. Iodophor และเขียนถึง CHX แต่ CHX ไม่อยู่ในช้อยส์ชุดนี้ CDC ระบุว่าสารอินทรีย์รบกวน chlorine/iodine disinfectants ได้ ส่วน glutaraldehyde ยังออกฤทธิ์เมื่อมีสารอินทรีย์ จึงไม่ควรใช้คำตอบ b ยืนยันหลักการฆ่าเชื้อโดยไม่มีเงื่อนไข", "verificationUrl": "https://www.cdc.gov/infection-control/hcp/disinfection-sterilization/chemical-disinfectants.html", "verificationLabel": "CDC: Chemical Disinfectants"}, {"id": "q55", "source": "ข้อ 55", "chapter": 8, "question": "ข้อใดถูก เกี่ยวกับข้อควรระวังในการใช้ hydrogen peroxide ในลักษณะเป็น antiseptic", "choices": ["หลีกเลี่ยงการใช้ต่อเนื่องเป็นเวลานาน เนื่องจากมีผลในการกดภูมิคุ้มกันบริเวณผิวหนังที่ใช้", "ห้ามใส่ลงในแผลลึกเนื่องจากมีผลต่อการลดจำนวนของเกล็ดเลือดทำให้เลือดบริเวณบาดแผล แข็งตัวช้า", "ไม่ใส่ลงในโพรงแผลอุดตัน เพราะไม่สามารถซึมเข้าสู้บาดแผลได้", "ไม่ควรใช้เป็นประจำ เพราะทำให้แผลหายช้า เนื่องจากมีพิษต่อ fibroblasts", "หากใช้ปนะจำจะทำให้ติดสีบริเวณผิวหนังอย่างถาวรได้"], "answer": "d. มีพิษต่อ fibroblasts ทำให้แผลหายช้า", "explanation": "Oxidative injury ทำลายเซลล์ที่ช่วยซ่อมแซมแผล; ไม่ใช่กดภูมิหรือทำให้เกล็ดเลือดต่ำตาม a/b; ห้ามใส่โพรงปิดมีเหตุเรื่องก๊าซ/แรงดัน ไม่ใช่เพราะซึมไม่ได้ตาม c; ไม่ทำให้ติดสีถาวรแบบ e", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q56", "source": "ข้อ 56", "chapter": 8, "question": "สารใดสามารถทำลายเชื้อก่อวัณโรคได้", "choices": ["Silver nitrate", "Chlorhexidine", "Cationic surface-active agent", "Anionic surface-active agent", "Phenol"], "answer": "e. Phenol", "explanation": "Phenolic disinfectants มีฤทธิ์ tuberculocidal ตามความเข้มข้น/เวลาที่กำหนด; Silver nitrate ไม่ใช่ตัวเลือกเด่น; Chlorhexidine/QAC/anionic detergent ไม่ใช่สารมาตรฐานสำหรับฆ่าเชื้อวัณโรค", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q57", "source": "ข้อ 57", "chapter": 8, "question": "ข้อใดผิดเกี่ยวกับ systemic และ topical fluorides ในการป้องกันฟันผุ", "choices": ["อาจเกิด dental fluorosis ขึ้นได้จากการใช้ systemic fluorides เป็นระยะเวลานาน", "สร้างสารที่ทนทานต่อกรดบริเวณของเคลือบฟัน", "ลดการละลายของผิวเคลือบฟัน", "ยับยั้งการสูญเสียแร่ธาตุของเคลือบฟันบริเวณรอยโรคฟันผุ", "ยับยั้งการเจริญของเชื้อแบคทีเรียเมื่อใช้ systemic fluorides ที่ความเข้มข้นสูงพอ"], "answer": "e. ใช้ systemic fluoride เพื่อยับยั้งแบคทีเรียที่ความเข้มข้นสูง", "explanation": "ฤทธิ์ antibacterial ต้องอาศัย fluoride เฉพาะที่ที่ความเข้มข้นเหมาะสม ไม่ใช่เพิ่ม systemic dose; fluoride ลด demineralization ส่งเสริม remineralization และเพิ่มความทนกรด; รับเกินช่วงสร้างฟันเสี่ยง fluorosis", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q58", "source": "ข้อ 58", "chapter": 8, "question": "ผู้ป่วยใช้น้ำยาบ้วนปากเป็นประจำ พบว่าสามารถควบคุมการเกิดแผ่นคราบจุลินทรีย์ และลดการอักเสบ ของเหงือกได้ แต่มีหินปูนเพิ่มขึ้น มีสีเหลืองน้ำตาลติดตามผิวฟันและลิ้น และมีการรับรสผิดปกติไป คาด ว่าคนไข้รายนี้ น่าจะใช้น้ำยาบ้วนปากที่มีส่วนผสมของสารใด", "choices": ["Chlorhexidine gluconate", "Alcohol", "Hydrogen peroxide", "Sodium fluoride", "Triclosan"], "answer": "a. Chlorhexidine gluconate", "explanation": "CHX ลด plaque/gingivitis แต่ทำให้ extrinsic stain รสเปลี่ยน และ calculus เพิ่ม; Alcohol เด่นเรื่องแสบ; H2O2 เป็น oxidizer; NaF ป้องกันฟันผุ; Triclosan เป็น antibacterial ไม่ใช่ชุดอาการจำเพาะนี้", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q59", "source": "ข้อ 59", "chapter": 8, "question": "สารในกลุ่มใดที่สามารถทำให้เกิดโรคในช่องปาก ในลักษณะเป็น local reaction", "choices": ["Analgesics", "Antineoplastic agents", "Antidiabetic agents", "Antithyroid agents", "Antibiotic mouth rinses"], "answer": "e. Antibiotic mouth rinses", "explanation": "สารสัมผัสเยื่อบุโดยตรงทำให้ระคายหรือ contact reaction ได้; Analgesic/antineoplastic/antidiabetic/antithyroid ในกรอบโจทย์เน้นผลจาก systemic use ทั้งนี้ยากลุ่มอื่นก็เกิด local injury ได้หากสัมผัสโดยตรง", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q60", "source": "ข้อ 60", "chapter": 8, "question": "สารใดที่ทำให้เกิด gingival pigmentation ได้", "choices": ["Chloroquine", "Cisplatin", "Captopril", "Cyclosporin", "Chlorpropamide"], "answer": "b. Cisplatin", "explanation": "เอกสารฉบับที่แก้ไขระบุเฉลยนี้ แต่ไม่ได้ให้คำอธิบายเพิ่มเติม จึงไม่ใส่คำอธิบายเดิมที่ถูกลบกลับมา", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq", "keyed": true}, {"id": "q61", "source": "ข้อ 61", "chapter": 9, "question": "ข้อใดเป็นกลไกการออกฤทธิ์ของ cyclosporin", "choices": ["ยับยั้งการสร้าง interleukin-2", "ยับยั้งการแบ่งตัวของเม็ดเลือดขาวชนิด T-cell", "ยับยั้งการสร้าง antibody โดย B-lymphocyte", "ยับยั้งการส่งสัญญาณไปยังเม็ดเลือดขาวทำให้ลดการสร้างสาร cytokine", "ยับยั้งการสร้างเม็ดเลือดขาวชนิด macrophage"], "answer": "a. ยับยั้งการสร้าง interleukin-2", "explanation": "จับ cyclophilin แล้วยับยั้ง calcineurin ลด NFAT activation และ IL-2 จึงลด T-cell activation; b เป็นผลปลายทางที่กว้างกว่า; c ไม่ใช่จุดหลัก; d อธิบายกว้าง; e ไม่ใช่การยับยั้ง macrophage production โดยตรง", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q62", "source": "ข้อ 62", "chapter": 9, "question": "ข้อใดเป็นข้อดีในการใช้ cyclosporin รักษาและป้องกันการปฏิเสธกราฟท์", "choices": ["ไม่เป็นพิษต่อตับ", "ไม่กดไขกระดูก", "สามารถให้ยาในรูปแบบรับประทานได้", "ไม่เป็นพิษต่อไต", "ไม่ทำให้ความดันโลหิตสูง"], "answer": "b. ไม่กดไขกระดูก [หรือกดน้อยในเชิงเปรียบเทียบ]", "explanation": "จุดเด่นคือไม่ myelosuppressive เท่ากลุ่ม cytotoxic; ยังมี nephrotoxicity ความดันสูง และพิษตับได้ จึงทำให้ a/d/e ผิด; c รับประทานได้จริงแต่ไม่ใช่จุดเด่นที่เฉลยนี้มุ่งถาม", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "review"}, {"id": "q63", "source": "ข้อ 63", "chapter": 9, "question": "ยาใดเป็น drug of choice ของโรค SLE", "choices": ["Tacrolimus", "Dexamethasone", "Azathioprine", "Prednisolone", "Cyclosporin"], "answer": "d. Prednisolone [ในตัวเลือกชุดนี้]", "explanation": "Glucocorticoid ลดการอักเสบ/ภูมิคุ้มกันใน SLE ตามความรุนแรง; Dexamethasone เป็น steroid เช่นกันแต่ไม่ใช่คำตอบมาตรฐานในชุดนี้; Tacrolimus/Cyclosporin เป็น calcineurin inhibitor; Azathioprine เป็น antimetabolite ใช้ steroid-sparing ได้ ไม่ควรสรุปว่า prednisolone เป็นยาหลักเพียงตัวเดียวของ SLE ทุกกรณี", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q64", "source": "ข้อ 64", "chapter": 9, "question": "ข้อใดเป็นยากดภูมิคุ้มกันที่มีกลไกการออกฤทธิ์เหมือนกับ cyclosporin", "choices": ["Sirolimus", "Azathioprine", "Tacrolimus", "Everolimus", "Mycophenolate mofetil"], "answer": "c. Tacrolimus", "explanation": "Tacrolimus จับ FKBP12 แล้วต้าน calcineurin ลด IL-2; Sirolimus/Everolimus จับ FKBP แต่ยับยั้ง mTOR; Azathioprine ยับยั้ง purine synthesis; Mycophenolate ยับยั้ง IMPDH", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q65", "source": "ข้อ 65", "chapter": 9, "question": "ข้อใดเป็นอาการไม่พึงประสงค์ที่พบบ่อย จากการใช้ยากระตุ้นระบบภูมิคุ้มกันในกลุ่มของ recombinant cytokines เช่น interferon, interleukin", "choices": ["มีไข้ หนาวสั่น", "ติดเชื้อง่าย", "ซีด", "หน้ามืด เป็นลม", "เลือดออกง่าย"], "answer": "a. มีไข้ หนาวสั่น", "explanation": "เกิด flu-like symptoms ได้บ่อยจาก cytokine effect; ติดเชื้อ ซีด เลือดออก หรือหน้ามืดอาจพบในยาหรือบริบทบางชนิด แต่ไม่ใช่ชุดอาการร่วมที่โจทย์ถาม", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q66", "source": "ข้อ 66", "chapter": 10, "question": "ข้อใดถูกต้องที่สุดเกี่ยวกับความหมายของ pharmacogenomics", "choices": ["การศึกษาเกี่ยวกับผลของโรคติดต่อทางพันธุกรรมต่อการออกฤทธิ์ของยาในแต่ละบุคคล", "การศึกษาเกี่ยวกับการกลายพันธุ์ของยีนที่ควบคุมโปรตีนที่เกี่ยวข้องกับการดูดซึมยาในแต่ละ บุคคล", "การศึกษาเกี่ยวกับผลของพันธุกรรมของยีนทั้งจีโนมต่อการเปลี่ยนแปลงยาในแต่ละบุคคล", "การศึกษาเกี่ยวกับการกลายพันธุ์ของยีนที่ควบคุมการทำงานของตัวรับของยา (receptor) ในแต่ ละบุคคล", "การศึกษาเกี่ยวกับผลของความหลากหลายทางพันธุกรรมของยีนทั้งจีโนมต่อการตอบสนองต่อยา ในแต่ละบุคคล"], "answer": "e. ผลของความหลากหลายทางพันธุกรรมทั้งจีโนมต่อการตอบสนองต่อยา", "explanation": "ครอบคลุมทั้งผลต่อเภสัชจลนศาสตร์และเภสัชพลศาสตร์ ไม่จำกัดโรคพันธุกรรม การดูดซึม metabolism หรือ receptor อย่างเดียวตาม a-d", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q67", "source": "ข้อ 67", "chapter": 10, "question": "ผลของการกลายพันธุ์ของยีนที่ควบคุมโปรตีนในข้อใดมีผลต่อระดับยาในเลือด", "choices": ["Alpha adrenergic receptors", "Angiotensin converting enzymes", "Cytochrome P-450 enzymes", "Ion channel", "Muscarinic receptor"], "answer": "c. Cytochrome P-450 enzymes", "explanation": "ความแปรผันเอนไซม์ metabolism เปลี่ยน clearance และระดับยา; adrenergic/muscarinic receptor และ ion channel เปลี่ยนการตอบสนองที่เป้าหมายเด่นกว่า; ACE เป็น drug target ในบริบทนี้", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q68", "source": "ข้อ 68", "chapter": 10, "question": "หากผู้ป่วยมีความจำเป็นต้องได้รับยา abacavir ก่อนที่แพทย์จะสั่งยา สามารถสั่งตรวจยีนชนิดใด เพื่อ ป้องกันการเกิดอาการแพ้ยาแบบ Steven-Johnson syndrome", "choices": ["CYP2C9", "HLA-B", "SULT1A1", "UGT1A1", "HLA-A"], "answer": "b. HLA-B; ระบุ allele คือ HLA-B*57:01", "explanation": "ใช้คัดกรอง abacavir hypersensitivity; CYP2C9 เด่น warfarin; UGT1A1 เด่น irinotecan; SULT1A1 เป็น conjugation enzyme; HLA-A ไม่ใช่ marker มาตรฐานนี้ หมายเหตุ: การระบุ SJS ในโจทย์ไม่แม่น เพราะ abacavir สัมพันธ์กับ multisystem hypersensitivity [อ้างอิงตรวจสอบ 4]", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q69", "source": "ข้อ 69", "chapter": 10, "question": "ผู้ป่วยโรคมะเร็งลำไส้ใหญ่รายหนึ่ง ได้รับการรักษาด้วยยา irinotecan พบว่าผู้ป่วยมีระดับเม็ดเลือดขาวต่ำ มาก และมีอาการท้องเสียอย่างรุนแรง คาดว่าผู้ป่วยรายนี้น่าจะมียีนชนิดใดเกิดการกลายพันธุ์", "choices": ["CYP2D6", "ABCB1", "CYP2C9", "CYP2C19", "UGT1A1"], "answer": "e. UGT1A1", "explanation": "UGT1A1 กำจัด active metabolite SN-38 ด้วย glucuronidation เมื่อกิจกรรมต่ำ พิษเพิ่ม; CYP2D6 เด่น codeine/tramadol; CYP2C9 เด่น warfarin; CYP2C19 เด่น omeprazole/clopidogrel; ABCB1 เป็น transporter ไม่ใช่คำตอบจำเพาะนี้", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q70", "source": "ข้อ 70", "chapter": 10, "question": "ผู้ป่วยมีความจำเป็นต้องใช้ยาชนิดใดที่แพทย์ควรจะทำการตรวจการกลายพันธุ์ของยีน CYP2C9 และยีน VKORC1 ก่อนการเลือกใช้ขนาดที่เหมาะสมกับผู้ป่วย", "choices": ["Dextromethorphan", "Omeprazole", "Debrisoquine", "Irinotecan", "Warfarin"], "answer": "e. Warfarin", "explanation": "CYP2C9 เกี่ยวกับกำจัดยา ส่วน VKORC1 เป็นเป้าหมาย vitamin K cycle; Dextromethorphan/Debrisoquine เด่น CYP2D6; Omeprazole เด่น CYP2C19; Irinotecan เด่น UGT1A1", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q71", "source": "ข้อ 71", "chapter": 11, "question": "ยาในกลุ่มใดที่สามารถใช้ได้ในหญิงตั้งครรภ์ เนื่องจากมีการทดสอบความปลอดภัยในสัตว์ทดลองมาแล้ว", "choices": ["Category B", "Category A", "Category D", "Category C", "Category X"], "answer": "a. Category B [ตามถ้อยคำเรื่องข้อมูลสัตว์ทดลองในระบบเก่า]", "explanation": "Category A มีข้อมูลในคนสนับสนุนมากกว่า; B หมายถึงไม่มีหลักฐานเสี่ยงในสัตว์หรือผลสัตว์ไม่ยืนยันในคนตามนิยามเดิม; C ยังมีความไม่แน่นอน/พบพิษสัตว์; D มีหลักฐานเสี่ยงในคนแต่บางกรณีประโยชน์อาจมากกว่า; X ห้ามใช้ ข้อสอบใช้ระบบตัวอักษรเก่า ไม่ใช่การรับประกันปลอดภัย", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q72", "source": "ข้อ 72", "chapter": 11, "question": "ข้อใดเป็นปัจจัยที่สำคัญที่สุดที่ใช้ในการพิจารณาเลือกใช้ยาในหญิงตั้งครรภ์", "choices": ["ยาอื่นๆที่ต้องใช้ร่วมกัน", "ระยะเวลาที่ใช้ในแผนการรักษา", "อายุครรภ์", "ขนาดของยา", "ตำแหน่งของทารกในครรภ์"], "answer": "c. อายุครรภ์", "explanation": "ช่วงพัฒนาการทารกกำหนดรูปแบบความเสี่ยง โดยเฉพาะ organogenesis; ยาร่วม ระยะเวลา และขนาดยาก็สำคัญ แต่ตำแหน่งทารกไม่ใช่เกณฑ์เภสัชวิทยาหลัก", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q73", "source": "ข้อ 73", "chapter": 11, "question": "อายุครรภ์ในช่วงใดที่ยาสามารถทำให้เกิดทารกก่อวิรูป (teratogenic effect) แล้วทำให้ปากแหว่งเพดาน โหว่", "choices": ["3-12 สัปดาห์", "1-2 สัปดาห์", "13-18 สัปดาห์", "25-36 สัปดาห์", "19-24 สัปดาห์"], "answer": "a. 3–12 สัปดาห์ [ช่วงที่โจทย์ให้]", "explanation": "เป็นช่วงสร้างอวัยวะในกรอบบทเรียน; 1–2 สัปดาห์เน้น all-or-none; ระยะหลังเด่นการโต/การทำงานมากกว่า หมายเหตุ: ต้องแยกอายุหลังปฏิสนธิกับอายุครรภ์จากประจำเดือน ตัวเลขไม่ควรนำมาเทียบกันโดยไม่ระบุฐาน", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q74", "source": "ข้อ 74", "chapter": 11, "question": "ยาปฏิชีวนะชนิดใดที่สามารถใช้ได้อย่างปลอดภัยในหญิงตั้งครรภ์", "choices": ["Gentamicin", "Cefazolin", "Cefotaxime", "Amoxicillin", "Tetracycline"], "answer": "d. Amoxicillin ตามเฉลย; b/c ก็เป็นยาที่ใช้ได้ในครรภ์เมื่อมีข้อบ่งชี้", "explanation": "Amoxicillin เป็น penicillin; Cefazolin/Cefotaxime เป็น cephalosporins ที่ใช้ในครรภ์ได้เช่นกัน จึงไม่ใช่โจทย์คำตอบเดียวที่ดี; Gentamicin มีข้อกังวลพิษหู/ไตและใช้เมื่อเหมาะสม; Tetracycline มีผลฟันและกระดูก", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "review"}, {"id": "q75", "source": "ข้อ 75", "chapter": 11, "question": "หากทารากที่คลอดออกมามีลักษณะริมฝ4ปากบนบาง (thin upper lip) มีร่องหน้าจมูกตื้นมาก (smooth philtrum) หูมีร่องคล้ายรางรถไฟ (railroad track ear) แสดงว่ามารดาของทารกได้รับสารหรือยาชนิดใดใน ระหว่างตั้งครรภ์", "choices": ["Phenytoin", "Diazepam", "Codeine", "Cocaine", "Alcohol"], "answer": "e. Alcohol", "explanation": "เป็นลักษณะใน fetal alcohol spectrum ตามภาพจำบทเรียน; Phenytoin เกี่ยว fetal hydantoin syndrome; Diazepam/Codeine มีข้อกังวลกดประสาททารก; Cocaine เกี่ยว vasoconstriction และปัญหารก ไม่ใช่ชุดลักษณะเด่นนี้", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q76", "source": "ข้อ 76", "chapter": 11, "question": "ยาใดที่ทำให้เกิดอาการ kernicterus จากการคั่งของบิลิรูบิน เนื่องจากการทำงานของตับและไตยังไม่ สมบูรณ์", "choices": ["Cyclosporin", "Chloramphenicol", "Penicillin", "Sulfonamide", "Tetracycline"], "answer": "d. Sulfonamide", "explanation": "แย่ง bilirubin จาก albumin ทำให้ free bilirubin เพิ่มและเข้าสมองทารก; Chloramphenicol เด่น gray baby syndrome; Tetracycline เด่นสีฟัน/กระดูก; Penicillin และ Cyclosporin ไม่ใช่กลไกจำเพาะนี้", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q77", "source": "ข้อ 77", "chapter": 11, "question": "เด็กทารกอายุ 6 เดือน มีฟันน้ำนมซี่แรกขึ้นแล้ว มาพบทันตแพทย์ด้วยอาการฟันกระแทกพื้น ตัวฟันโยก เกือบหลุด และมีเหงือกบวมอักเสบ ทันตแพทย์ได้ทำการถอนฟันน้ำนมซี่ที่ถูกกระแทกออก และควรสั่งยา ในข้อใดเพื่อบรรเทาอาการปวดและลดอาการบวมของเหงือกอักเสบ", "choices": ["Diclofenac", "Tramadol", "Naproxen", "Paracetamol", "Ibuprofen"], "answer": "e. Ibuprofen ตามโจทย์ที่ต้องการลดปวดและอักเสบ", "explanation": "มีทั้ง analgesic และ anti-inflammatory effect และมีรูปแบบเด็กตั้งแต่ประมาณ 6 เดือนตามผลิตภัณฑ์; Paracetamol ลดปวด/ไข้แต่ต้านอักเสบน้อย; Tramadol ไม่เหมาะกับทารก; Diclofenac/Naproxen ไม่ใช่ตัวเลือกแรกในเด็กวัยนี้ ต้องประเมินน้ำหนัก ภาวะขาดน้ำ และข้อห้ามก่อนใช้", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q78", "source": "ข้อ 78", "chapter": 11, "question": "ข้อใดถูกเกี่ยวกับการเปลี่ยนแปลงทางสรีระวิทยาของผู้สูงอายุที่มีผลต่อกระบวนการเภสัชจลนศาสตร์", "choices": ["อัตราการไหลเวียนเลือดไปยังตับเพิ่มขึ้น", "ปริมาณโปรตีนอัลบูมินเพิ่มขึ้น", "อัตราการไหลเวียนเลือดไปยังไตเพิ่มขึ้น", "ปริมาณโปรตีน alpha1-acid-glycoprotein เพิ่มขึ้น", "ปริมาณน้ำในร่างกายเพิ่มขึ้น"], "answer": "d. Alpha1-acid-glycoprotein เพิ่มขึ้น [ตามกรอบบทเรียน]", "explanation": "จับยาที่เป็น weak base จึงเปลี่ยน free fraction; hepatic/renal blood flow มักลดลง; total body water ลดลง; albumin ไม่ได้เพิ่มตาม a-c/e ทั้งนี้ระดับโปรตีนแปรตามโรคและภาวะโภชนาการ ไม่เพิ่มในผู้สูงอายุทุกคน", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q79", "source": "ข้อ 79", "chapter": 11, "question": "ทันตแพทย์ควรเลือกใช้ยาใดในผู้สูงอายุในการทำให้ผู้ป่วยคลายความวิตกกังวลก่อนทำหัตถการทางทันต กรรม", "choices": ["Zopiclone", "Zolpidem", "Diazepam", "Temazepam", "Lorazepam"], "answer": "e. Lorazepam", "explanation": "ผ่าน glucuronidation ไม่มี active metabolite จึงเป็นตัวเลือกในกลุ่ม LOT; Temazepam ก็อยู่ LOT แต่เด่นใช้ช่วยนอน; Diazepam มี active metabolite สะสมนาน; Zolpidem/Zopiclone เน้น insomnia ยากดประสาททุกตัวเพิ่มเสี่ยงง่วง/หกล้มในผู้สูงอายุ", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q80", "source": "ข้อ 80", "chapter": 11, "question": "ก่อนการใช้ยาในผู้สูงอายุ แพทย์ต้องประเมินการทำงานของไต โดยการตรวจพารามิเตอร์ชนิดใดในเลือด เพื่อนำไปคำนวณขนาดของยาที่ต้องใช้ในการรักษา", "choices": ["Bilirubin", "Creatinine", "ALT", "Uric acid", "AST"], "answer": "b. Creatinine", "explanation": "ใช้ร่วมอายุ น้ำหนัก และข้อมูลอื่นคำนวณ CrCl/eGFR; ไม่ควรใช้ค่า creatinine เดี่ยวโดยไม่ดูมวลกล้ามเนื้อ; Bilirubin/ALT/AST ประเมินตับ; Uric acid ไม่ใช่ตัวชี้หลักของ renal drug clearance", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "q81", "source": "ข้อ 81", "chapter": 12, "question": "การที่ผู้ป่วยได้รับยาลดกรดในกระเพาะอาหารร่วมกับยาอื่นๆ สามารถทำให้เกิด drug-drug interaction ที่ กระบวนการใดของเภสัชจลนศาสตร์", "choices": ["การขับออก", "การกระจาย", "การดูดซึม", "การเมตาบอลิซึม", "การ efflux ของยาผ่าน transporter"], "answer": "c. การดูดซึม", "explanation": "Antacid เปลี่ยน gastric pH และโลหะบางตัวจับยาเป็น chelate จึงลด absorption เช่น tetracycline/fluoroquinolone; ไม่ใช่ distribution/metabolism/excretion หรือ efflux เป็นหลักในโจทย์นี้", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q82", "source": "ข้อ 82", "chapter": 12, "question": "ยาใดมีคุณสมบัติเป็น enzyme inducer ที่สามารถกระตุ้นการทำงานของทั้งเอนไซม์ที่เปลี่ยนแปลงยาและ ตัวขนส่งยาออก", "choices": ["Rifampicin", "Amiodarone", "Omeprazole", "Indinavir", "Verapamil"], "answer": "a. Rifampicin", "explanation": "กระตุ้น drug-metabolizing enzymes และ P-glycoprotein ทำให้ยาบางตัวลดระดับ; Amiodarone/Indinavir/Verapamil เด่น inhibition; Omeprazole มี interaction ผ่าน CYP แต่ไม่ใช่ broad inducer ตามโจทย์", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q83", "source": "ข้อ 83", "chapter": 12, "question": "ยาใดมีคุณสมบัติเป็น enzyme inhibitor", "choices": ["Barbiturates", "Efavirenz", "Itraconazole", "Phenytoin", "Carbamazepine"], "answer": "c. Itraconazole", "explanation": "ยับยั้ง CYP3A4 ทำให้ยาร่วมบางตัวสะสม; Barbiturates, Phenytoin, Carbamazepine เป็น inducer; Efavirenz มีผลซับซ้อนแต่เด่น induction ของ CYP บางชนิดในกรอบตัวเลือก", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q84", "source": "ข้อ 84", "chapter": 12, "question": "ผู้ป่วยโรคหัวใจและได้รับการรักษาโดยใช้ยา warfarin มาพบทันตแพทย์ เพื่อรักษาฟันผุและมีอาการปวด ฟันร่วมด้วย ทันตแพทย์ควรสั่งยาชนิดใดเพื่อบรรเทาอาการปวดฟันให้ผู้ป่วยรายนี้", "choices": ["Aspirin", "Diclofenac", "Ibuprofen", "Acetaminophen", "Naproxen"], "answer": "d. Acetaminophen", "explanation": "ตัวเลือกอื่นเป็น NSAIDs/aspirin เพิ่ม GI bleeding และบางตัวกระทบเกล็ดเลือด; Paracetamol ไม่มีฤทธิ์ต้านเกล็ดเลือดแบบ aspirin แต่ใช้ขนาดสูงหลายวันร่วม warfarin ยังเพิ่ม INR ได้ จึงไม่ใช่ไม่มี interaction", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q85", "source": "ข้อ 85", "chapter": 12, "question": "ทันตแพทย์ควรซักประวัติเกี่ยวกับการใช้ยาในข้อใด เพื่อใช้ประกอบการสั่งยาปฏิชีวนะในผู้ป่วยที่ได้รับ หัตถการทางทันตกรรม ในการป้องกันการติดเชื้อ", "choices": ["Ibuprofen", "Erythromycin", "Oral contraceptives", "Warfarin", "Fluoxetine"], "answer": "c. Oral contraceptives ตามเฉลยโพย", "explanation": "โจทย์เดิมเน้นฮอร์โมนคุมกำเนิด โดย interaction ชัดกับ rifampicin ไม่ควรเหมารวม amoxicillin; Warfarin สำคัญเพราะ metronidazole/macrolide/azole บางตัวเพิ่ม INR; Erythromycin บ่ง interaction/ยาที่ใช้อยู่; Fluoxetine และ Ibuprofen ก็มีผลต่อ bleeding risk จึงควรซักยาทั้งหมด โจทย์ไม่จำเพาะพอให้ c เป็นคำตอบเดียว [อ้างอิงตรวจสอบ 1]", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq", "keyed": true}, {"id": "q86", "source": "ข้อ 86", "chapter": 13, "question": "ข้อใดถูกเกี่ยวกับหลักการการใช้ยาอย่างสมเหตุผล", "choices": ["เลือกใช้ยาต้นแบบ (original drug) เสมอ เนื่องจากประสิทธิภาพดีกว่ายาสามัญ (generic drug)", "ใช้ยาในขนาดสูงสุดเพื่อให้หายป่วยเร็วที่สุด", "เลือกใช้ยากลุ่มใหม่ล่าสุดที่มีการพัฒนาออกสู่ตลาด", "ใช้ยาเมื่อมีอาการที่ตรงกับข้อบ่งชี้ของยาเท่านั้น", "ใช้ยาโดยคำนึงถึงอาการสำคัญที่ผู้ป่วยมาพบแพทย์ (chief complaint) เท่านั้น"], "answer": "d. ใช้ยาเมื่อมีข้อบ่งชี้", "explanation": "เลือกยาตามโรค หลักฐาน ประสิทธิผล ความปลอดภัย และต้นทุน; ไม่จำเป็นต้อง original หรือใหม่ล่าสุด; ไม่ใช้ขนาดสูงสุดเสมอ; ไม่พิจารณาเพียง chief complaint โดยละเลยโรคร่วม", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q87", "source": "ข้อ 87", "chapter": 13, "question": "ข้อใดเป็นการใช้ยาอย่างสมเหตุผล", "choices": ["จ่ายยา celecoxib เพื่อบรรเทาอาการปวดหลังทำหัตถการ ในผู้ป่วยทุกราย", "แนะนำให้ผู้ป่วยกินยา norfloxacin ร่วมกับนม เพื่อลดอาการคลื่นไส้จากยา norfloxacin", "ต่ายยา clindamycin เพื่อรักษาการติดเชื้อในช่องปาก ในผู้ป่วยที่แพ้ยา penicillin", "กินยา amoxicillin เมื่อมีอาการหวัด", "จ่ายยา paracetamol (500 mg) 2 เม็ด ทุก 4 ชั่วโมง เพื่อแก้ปวด ลดไข้"], "answer": "c. Clindamycin ในผู้แพ้ penicillin [ดีที่สุดในกรอบตัวเลือกเดิม]", "explanation": "ใช้รักษาการติดเชื้อที่ไวต่อยาได้เมื่อมีข้อบ่งชี้ แต่ต้องคำนึงถึง C. difficile และทางเลือกอื่น; Celecoxib ไม่ให้ทุกคน; norfloxacin จับแคลเซียมในนมทำให้ดูดซึมลด; หวัดไวรัสไม่ใช้ amoxicillin; paracetamol 1 g ทุก 4 ชั่วโมงตลอดวันรวม 6 g เกิน 4 g/วัน", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q88", "source": "ข้อ 88", "chapter": 13, "question": "ผู้ป่วยชายอายุ 60 ปี เป็นโรคกล้ามเนื้อหัวใจขาดเลือดและความดันโลหิตสูง มีประวัติแพ้ยา sulfonamide หลังผ่าตัดฟันคุด ได้รับยา etoricoxib (90 mg) 1 เม็ด วันละครั้ง จำนวน 10 เม็ด การใช้ยานี้สมเหตุสมผล หรือไม่ เพราะเหตุใด", "choices": ["สมเหตุผล เพราะ etoricoxib มีกลไกการออกฤทธิ์ที่จำเพาะต่อ COX2", "สมเหตุผล เพราะ etoricoxib มีข้อบ่งใช้สำหรับบรรเทาอาการปวด", "ไม่สมเหตุผล เพราะ etoricoxib มีโครงสร้างคล้ายกับ sulfonamide อาจเกิดการแพ้ยาข้ามกลุ่มได้", "สมเหตุผล เพราะ etoricoxib ทำให้เกิดอาการข้างเคียงต่อทางเดินอาหารน้อย", "ไม่สมเหตุผล เพราะ etoricoxib อาจทำให้โรคประจำตัวของผู้ป่วยแย่ลง"], "answer": "e. ไม่สมเหตุผล เพราะอาจทำให้โรคประจำตัวแย่ลง", "explanation": "COX-2 selective ยังเสี่ยงลิ่มเลือด ความดันสูง และบวมน้ำ; ข้อบ่งใช้แก้ปวด/ผล GI น้อยกว่าไม่ลบ CV risk; ประวัติ sulfonamide ไม่ใช่เหตุหลักในโจทย์ etoricoxib นี้ อย่าสับสนกับโครงสร้าง celecoxib", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q89", "source": "ข้อ 89", "chapter": 13, "question": "ผู้ป่วยมีประวัติกินยา warfarin เป็นประจำ หลังถอนฟัน ได้รับยา paracetamol 500 mg กินครั้งละ 1-2 เม็ด ทุก 4-6 ชั่วโมง (ไม่เกิน 4 g ต่อวัน) จำนวน 20 เม็ด การใช้ยานี้สมเหตุผลหรือไม่ เพราะเหตุใด", "choices": ["ไม่สมเหตุผล เพราะ ขนาดยา paracetamol มากเกินไป อาจทำให้เกิด bleeding", "สมเหตุผล เพราะ paracetamol ทำให้เกิดอาการข้างเคียงต่อตับและไตน้อย", "สมเหตุผล เพราะ ขนาดยา paracetamol เหมาะสมแล้ว", "ไม่สมเหตุผล เพราะ paracetamol ไม่มีฤทธิ์ต้านอักเสบ อาจบรรเทาอาการปวดได้ไม่ดี", "สมเหตุผล เพราะ paracetamol มีข้อบ่งใช้สำหรับบรรเทาอาการปวด"], "answer": "a. ไม่สมเหตุผล เพราะ ขนาดยา paracetamol มากเกินไป อาจทำให้เกิด bleeding", "explanation": "เอกสารฉบับที่แก้ไขระบุเฉลยนี้ แต่ไม่ได้ให้คำอธิบายเพิ่มเติม จึงไม่ใส่คำอธิบายเดิมที่ถูกลบกลับมา", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq", "keyed": true}, {"id": "q90", "source": "ข้อ 90", "chapter": 13, "question": "ผู้ป่วยได้รับยา serratiopeptidase 5 mg กินครั้งละ 2 เม็ด วันละ 3 ครั้ง จำนวน 20 เม็ด เพื่อบรรเทา อาการเหงือกอักเสบ การใช้ยานี้สมเหตุผลหรือไม่ เพราะเหตุใด", "choices": ["สมเหตุผล เพราะ ขนาดยา serratiopeptidase เหมาะสมแล้ว", "สมเหตุผล เพราะ serratiopeptidase ไม่ใช่ยาปฏิชีวนะ จึงไม่ทำให้เกิดปัญหาเชื้อดื้อยา", "ไม่สมเหตุผล เพราะ serratiopeptidase มีราคาแพง", "สมเหตุผล เพราะ serratiopeptidase มีข้อบ่งใช้สำหรับบรรเทาอาการอักเสบ", "ไม่สมเหตุผล เพราะ serratiopeptidase ไม่มีการศึกษาประสิทธิผลที่แน่ชัด"], "answer": "e. ไม่มีการศึกษาประสิทธิผลที่แน่ชัด", "explanation": "การสั่งยาต้องมีหลักฐานประโยชน์ ไม่ใช่อาศัยขนาดถูกหรือไม่ใช่ antibiotic; ราคาสูงเพียงอย่างเดียวไม่ตัดสิน; มีคำกล่าวอ้างลดอักเสบไม่เท่ากับมีหลักฐานเพียงพอ", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q91", "source": "ข้อ 91", "chapter": 6, "question": "ผู้ป่วยรายใดกระตุ้นให้อาเจียนได้", "choices": ["ผู้ป่วยที่ไม่รู้สึกตัวจากการได้รับสารพิษไม่ทราบชนิด", "ผู้ป่วยที่กินพาราเซตามอล เกินขนาดมา 10 นาที", "ผู้ป่วยที่กินกรดน้ำส้ม", "ผู้ป่วยที่มีอาการชักอย่างรุนแรงจากการกินสารเคมีกำจัดแมลง", "ผู้ป่วยกินโซดาไฟ"], "answer": "b ตามข้อสอบเก่า; ปัจจุบันไม่แนะนำกระตุ้นให้อาเจียนเอง", "explanation": "a/d เสี่ยงสำลักเพราะหมดสติ/ชัก; c/e เป็นสารกัดกร่อน อาเจียนทำให้เนื้อเยื่อสัมผัสซ้ำ; โพยจึงเลือกผู้กิน paracetamol ไม่นาน แต่แนวทางปัจจุบันไม่ใช้ induced emesis เป็นกิจวัตร [อ้างอิงตรวจสอบ 5]", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "review"}, {"id": "q92", "source": "ข้อ 92", "chapter": 6, "question": "ข้อใดไม่สามารถลดการดูดซึมสารพิษเข้าสู่กระแสเลือดในผู้ป่วยที่ได้รับสารพิษ", "choices": ["Hemodialysis", "ล้างท้อง", "กระตุ้นให้อาเจียน", "ให้ยาถ่าย", "สวนล้างลำไส้"], "answer": "a. Hemodialysis", "explanation": "ฟอกเลือดกำจัดสารพิษที่เข้าสู่เลือดแล้ว ต่างจาก GI decontamination; ล้างท้อง อาเจียน ยาถ่าย และ whole-bowel irrigation เป็นวิธีที่มุ่งสารในทางเดินอาหารตามตำราเดิม แต่ไม่ได้ใช้ทุกวิธีเป็นกิจวัตรในปัจจุบัน", "origin": "ข้อสอบเต็ม", "correct": 0, "type": "mcq"}, {"id": "q93", "source": "ข้อ 93", "chapter": 6, "question": "ข้อใดเป็นกลไกการออกฤทธิ์ของ ethanol ในการช่วยเหลือผู้ป่วยที่ได้รับ methanol", "choices": ["กระตุ้นการทำงานของ alcohol dehydrogenase", "แย่งจับกับ aldehyde dehydrogenase", "ทำให้สัดส่วนของ NADH2/NAD เพิ่มขึ้น", "ทำลาย functional molecule ของ alcohol dehydrogenase", "ทำให้ alcohol dehydrogenase metabolize ethanol แทน methanol"], "answer": "d. ทำลาย functional molecule ของ alcohol dehydrogenase", "explanation": "เอกสารฉบับที่แก้ไขระบุเฉลยนี้ แต่ไม่ได้ให้คำอธิบายเพิ่มเติม จึงไม่ใส่คำอธิบายเดิมที่ถูกลบกลับมา", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq", "keyed": true, "verification": "เอกสารเลือก d แต่กลไกของ ethanol คือแข่งขันเป็น substrate ของ alcohol dehydrogenase ลดการสร้าง toxic metabolites ซึ่งตรงกับช้อยส์ e ไม่ใช่ทำลาย functional molecule ของเอนไซม์ คะแนนข้อนี้เทียบเฉลยเอกสารเท่านั้น", "verificationUrl": "https://pubmed.ncbi.nlm.nih.gov/21167143/", "verificationLabel": "งานวิจัย ADH: inhibition by ethanol"}, {"id": "q94", "source": "ข้อ 94", "chapter": 6, "question": "สารใดใช้แก้ไขอาการของ muscarinic signs ที่เกิดจากการจับของ acetylcholine กับ muscarinic receptor ในขณะที่ได้รับสาร organophosphate", "choices": ["N-acetylcysteine", "Activated charcoal", "Fomepizole", "Atropine", "Methionine"], "answer": "d. Atropine", "explanation": "ต้าน muscarinic receptor ลดน้ำลาย/สารคัดหลั่งและ bronchoconstriction; NAC ใช้ paracetamol; Charcoal ดูดซับใน GI; Fomepizole ยับยั้ง ADH; Methionine เกี่ยว glutathione precursor ไม่แก้ muscarinic toxidrome", "origin": "ข้อสอบเต็ม", "correct": 3, "type": "mcq"}, {"id": "q95", "source": "ข้อ 95", "chapter": 6, "question": "ข้อใดเป็นกลไกการออกฤทธิ์ของ N-acetylcysteine ในการรักษาอาการพิษจาก acetaminophen", "choices": ["ขัดขวางการทำงานของ CYP2E1", "ยับยั้งการทำงานของ glutathione transferase", "ช่วยในการสร้าง glutathione", "ยับยั้งการทำงานของ UGT", "จับกับสาร NAPQI"], "answer": "c. ช่วยในการสร้าง glutathione", "explanation": "ให้ cysteine สำหรับสร้าง glutathione กำจัด NAPQI; ไม่ใช่ยับยั้ง CYP2E1, glutathione transferase หรือ UGT เป็นกลไกหลัก; การจับ/ลด reactive metabolite อาจมีส่วน แต่คำตอบหลักของข้อสอบคือ replenishment of glutathione", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q96", "source": "ข้อ 96", "chapter": 6, "question": "การได้รับยาในข้อใดมีโอกาสทำให้เกิด serotonin syndrome ได้", "choices": ["Benztropine overdose", "Morphine intoxication", "Fluoxetine overdose", "Diazepam overdose", "Haloperidol overdose"], "answer": "c. Fluoxetine overdose", "explanation": "SSRI ยับยั้ง serotonin reuptake ทำให้ serotonergic activity สูง; Benztropine เกินทำให้ anticholinergic toxidrome; Morphine เด่น opioid depression; Diazepam เด่น sedation; Haloperidol เด่น EPS/NMS", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q97", "source": "ข้อ 97", "chapter": 6, "question": "ข้อใดเป็นกลไกการออกฤทธิ์ของ activated charcoal", "choices": ["กระตุ้นการเกิด enterohepatic recirculation", "เร่งการขับออกสารพิษทางไต", "กระตุ้น chemoreceptor trigger zone", "ดูดซับสารพิษในกระแสเลือด", "ดูดซับสารพิษในทางเดินอาหาร"], "answer": "e. ดูดซับสารพิษในทางเดินอาหาร", "explanation": "Adsorption ที่ผิวถ่านลดการดูดซึมผ่านลำไส้; ไม่ได้ดูดซับเลือดโดยตรง ไม่เร่งไตหรือกระตุ้น CTZ; multiple-dose charcoal ยังช่วยลด enterohepatic recycling ของยาบางชนิด ไม่ใช่กระตุ้น recycling", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq"}, {"id": "q98", "source": "ข้อ 98", "chapter": 6, "question": "Naloxone ใช้แก้ไขอาการพิษจากสารพิษ/ยาในข้อใด", "choices": ["Amphetamine", "Pethidine", "Salicylate", "Paraquat", "Morphine"], "answer": "e. Morphine ถูกได้ทั้งคู่", "explanation": "เป็น opioid จึงแก้ respiratory depression ด้วย opioid antagonist ได้; Amphetamine เป็น stimulant; Salicylate เป็นพิษอีกกลไก; Paraquat เป็นสารกำจัดวัชพืช โพยเลือก Morphine แต่โจทย์มีคำตอบถูกมากกว่าหนึ่งข้อ", "origin": "ข้อสอบเต็ม", "correct": 4, "type": "mcq", "keyed": true}, {"id": "q99", "source": "ข้อ 99", "chapter": 6, "question": "ข้อใดเป็นกลไกการออกฤทธิ์แบบ 2-PAM", "choices": ["Inhibit choline transferase activity", "Reversible acetylcholine activity", "Reversible acetylcholinesterase activity", "Inhibit acetylcholine activity", "Reversible choline transferase activity"], "answer": "c ตามเจตนา: reactivation of acetylcholinesterase", "explanation": "Pralidoxime ช่วยปลด phosphate จาก AChE ก่อน aging ให้ enzyme กลับทำงาน; ไม่ได้ยับยั้ง ACh synthesis/transferase หรือยับยั้ง ACh โดยตรง คำว่า “Reversible acetylcholinesterase activity” ในช้อยส์ไม่ใช่คำอธิบายมาตรฐาน ควรอ่านว่า reactivation", "origin": "ข้อสอบเต็ม", "correct": 2, "type": "mcq"}, {"id": "q100", "source": "ข้อ 100", "chapter": 6, "question": "ผู้ป่วยชายอายุ 58 ปี อาการสำคัญ นอนหมดสติ น้ำลายฟูมปาก กล้ามเนื้อเกร็งกระตุก ถ่ายเหลวจำนวน มาก ความดันโลหิต 80/50 mmHg อัตราการเต้นของหัวใจ 62 ครั้ง/นาที อัตราการหายใจ 20 ครั้ง/นาที, อุณหภูมิกาย 37 องศาเซลเซียส ไม่รู้สึกตัว ขนาดของม่านตา 1 mm ทั้งสองข้าง ข้อใดเป็นชนิดของสารพิษ และวิธีการรักษา", "choices": ["Cyanide : amyl nitrite และ sodium thiosulphate", "Organophosphate : 2-PAM และ atropine", "Methanol : ethanol", "Paraquat : activated charcoal, vitamin C", "Synthetic pyrethroids : benzodiazepines"], "answer": "b. Organophosphate : 2-PAM และ atropine", "explanation": "เป็น cholinergic toxidrome มี muscarinic ร่วม nicotinic signs; Atropine ต้าน muscarinic และ 2-PAM ฟื้น AChE ก่อน aging; Cyanide เด่น cellular hypoxia; Methanol เด่น acidosis/ตา; Paraquat เด่นพิษปอด; Pyrethroid อาจชักแต่ไม่ใช่ชุด cholinergic นี้", "origin": "ข้อสอบเต็ม", "correct": 1, "type": "mcq"}, {"id": "n4", "source": "พ20 • 13", "chapter": 2, "question": "ชาย 20 ปี กิน ibuprofen หลังผ่าฟันคุดแล้ว dyspepsia ยาไปทำอะไร", "choices": [], "answer": "ยับยั้ง COX-1 ลด prostaglandin ที่ปกป้องกระเพาะ", "explanation": "เมือกและ bicarbonate ลดลง เยื่อบุกระเพาะถูกกรดทำลายง่าย", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n5", "source": "พ20 • 16", "chapter": 2, "question": "ผู้ป่วยซึมเศร้า ไม่ควรให้ยาแก้ปวดใดมากที่สุด", "choices": [], "answer": "Indomethacin ตามโพย", "explanation": "ยามี CNS adverse effects รวมถึงอาการทางจิต/ซึมเศร้าได้ จึงเป็น key ที่โพยเน้น ไม่ใช่ข้อห้ามยาแก้ปวดทุกตัวในผู้ป่วยซึมเศร้า", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n6", "source": "พ20 • 22", "chapter": 3, "question": "macroglossia แผลหายช้า เหนื่อยง่าย ได้ morphine จะเกิดอะไร", "choices": [], "answer": "เสี่ยง respiratory depression โดยโพยเขียน respiratory distress", "explanation": "อาการชวนคิด hypothyroidism ซึ่งไวต่อยากดประสาท/การหายใจมากขึ้น แต่ข้อมูลนี้ไม่ยืนยันการวินิจฉัยเพียงอย่างเดียว", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n8", "source": "พ20 • 25", "chapter": 3, "question": "กลไก MMI", "choices": [], "answer": "ยับยั้ง thyroid peroxidase", "explanation": "Methimazole ยับยั้ง organification และ coupling จึงลดการสร้างฮอร์โมนใหม่ ไม่ได้ยับยั้ง peripheral conversion แบบ PTU", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n12", "source": "พ21 • 47", "chapter": 8, "question": "Cold sterilant คืออะไร", "choices": [], "answer": "Glutaraldehyde", "explanation": "ใช้กับเครื่องมือทนความร้อนไม่ได้ โดยระดับ sterilization ต้องใช้ความเข้มข้นและเวลาสัมผัสเพียงพอ", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n18", "source": "พ21 • 88", "chapter": 13, "question": "แพ้ sulfonamide หลังถอนฟันคุดให้ ibuprofen เหมาะสมหรือไม่", "choices": [], "answer": "ประวัติ sulfonamide อย่างเดียวไม่ใช่ข้อห้าม ibuprofen", "explanation": "ไม่ใช่การแพ้ข้ามกลุ่มแบบเดียวกัน แต่ต้องดูประวัติ NSAID allergy โรคไต/กระเพาะ/หัวใจร่วมด้วย", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "review"}, {"id": "n19", "source": "พ21 • 97", "chapter": 6, "question": "ยาแก้พิษ neostigmine", "choices": [], "answer": "Atropine สำหรับ muscarinic effects", "explanation": "Neostigmine เป็น reversible AChE inhibitor; atropine ลดน้ำลาย/หัวใจช้า/หลอดลมหด ไม่แก้กล้ามเนื้ออ่อนแรง nicotinic โดยตรง และไม่ใช่ข้อบ่งใช้ประจำของ 2-PAM", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n24", "source": "พ21 • 76", "chapter": 12, "question": "ผู้ป่วยใช้ enzyme inducer จะสั่งยาเพิ่มควรทำอย่างไร: สั่งเลย / หยุด inducer / เพิ่ม inhibitor / เลือกคนละ enzyme / เลือก enzyme เดียวกันแต่…", "choices": [], "answer": "เลือกยาที่ไม่ถูก inducer นั้นกระทบ เมื่อทำได้", "explanation": "ในตัวเลือกที่เห็น “เลือกเอนไซม์คนละตัว” ใกล้ที่สุด; ช้อยส์สุดท้ายในโพยขาด ไม่เติมคำที่หาย และ inducer บางตัวกระตุ้นหลาย pathway จึงยังต้องตรวจ interaction", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n25", "source": "พ21 • 82", "chapter": 12, "question": "ชาย 55 ปี AF ใช้ warfarin ได้ “methriazole” กับ “clos…” จะเกิดอะไร", "choices": ["หัวใจเร็ว", "หัวใจช้า", "ความดันสูง", "เลือดออกในสมอง", "หัวใจวายเฉียบพลัน"], "answer": "เลือดออกในสมองตามโพย", "explanation": "ชื่อยาต้นฉบับไม่ชัด มีรอยเขียน clotrimazole; หากหมายถึงยาที่ยับยั้ง metabolism ของ warfarin จะเพิ่ม INR และ bleeding จึงอธิบายได้ แต่ไม่ยืนยันชื่อยาที่ขาด", "origin": "บันทึก/ภาพข้อสอบ", "correct": 3, "type": "mcq", "keyed": true}, {"id": "n27", "source": "พ21 • 2", "chapter": 0, "question": "ข้อใดถูกเกี่ยวกับ histamine receptor", "choices": [], "answer": "H1 ที่กล้ามเนื้อเรียบหลอดลม", "explanation": "กระตุ้นทำให้ bronchoconstriction; H2 เด่นกรดกระเพาะ/หัวใจ", "origin": "บันทึก/ภาพข้อสอบ", "correct": null, "type": "recall"}, {"id": "n29", "source": "พ22 • ไม่ระบุเลข", "chapter": 6, "question": "Cyanide antidote คืออะไร", "choices": [], function home(){screen='home';nav();$('app').innerHTML=`<section class="hero"><span class="small muted">YOUR NEXT STUDY SESSION</span><h1>อ่านมาแล้ว<br>ลองตอบดู.</h1><p class="muted">Pharmaco รอบ 3 — เลือกบทที่อยากทบทวน<br>หรือทำรวมทุกบท โดยยังเรียงตามบทเสมอ</p><div class="stats"><div class="stat"><strong>${TOTAL}</strong><span>รายการหลังตัดข้อซ้ำและคัดบท</span></div><div class="stat"><strong>14</strong><span>หมวดบทเรียน</span></div><div class="stat"><strong>${COUNTS.mcq}</strong><span>ข้อปรนัยที่ให้คะแนนได้</span></div></div><div class="row"><button class="primary" id="startAll">เริ่มรวมทุกบท</button>${state?'<button id="resume">ทำชุดเดิมต่อ</button>':''}<select id="filter" aria-label="ชนิดข้อสอบ"><option value="all">ทั้งหมด · ${TOTAL} รายการ</option><option value="mcq">ปรนัย · ${COUNTS.mcq} ข้อ</option><option value="recall">คิดคำตอบเอง · ${COUNTS.recall} รายการ</option><option value="review">ทบทวนข้อกำกวม · ${COUNTS.review} รายการ</option></select></div><p class="small muted">ปรนัยเทียบเฉลยเอกสาร · คิดคำตอบเองประเมินหลังเปิดเฉลย · ข้อกำกวมไม่คิดคะแนน</p></section><section><div class="row between" style="margin:28px 0 16px"><h3>เลือกทำแยกบท</h3><span class="small muted">คงลำดับข้อในแต่ละบท</span></div><div class="chapter-grid">${DATA.chapters.map((c,i)=>{const a=allFor(i,'all');return `<button class="tile" data-ch="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(c)}</strong><small>${a.length} รายการ · ปรนัย ${a.filter(x=>x.type==='mcq').length} ข้อ</small></div></button>`}).join('')}</div></section><details class="card"><summary>การแก้ไขล่าสุดและข้อมูลชุดนี้</summary><p>อัปเดตจากเอกสาร Word ที่แนบ: ข้อ 29, 54, 60, 85, 89, 93, 98 และข้อความในข้อ 46 เก็บเฉลยในเอกสารเป็นหลักสำหรับเทียบคะแนน</p><p>พ21 • 82 ในไฟล์ยังเป็นคำตอบเดิม เปลี่ยนเป็นแบบเลือกตอบจากตัวเลือกที่มีครบในบันทึก โดยคงหมายเหตุชื่อยาที่อ่านไม่ชัด</p><p>จากเดิม ${DATA.originalCount} รายการ ตัด ${DATA.removedCount} รายการ เหลือ ${TOTAL} รายการ แบ่งตาม 14 บทในรูปเท่านั้น</p><ul>${Object.entries(DATA.removedReasons).map(([k,v])=>`<li>${esc(k)}: ${v} รายการ</li>`).join('')}</ul><p>ข้อซ้ำเก็บฉบับสมบูรณ์ที่สุดไว้ครั้งเดียว เช่น ข้อเต็มกับบันทึกคำถามเดียวกัน ไม่ตัดเพียงเพราะกล่าวถึงยาตัวเดียวกัน ลำดับรวมเรียงบท 01–14 และแต่ละบทเรียงข้อสอบเต็มก่อนบันทึกตามตำแหน่งในเอกสาร</p><p>คำอธิบายที่ถูกลบจากไฟล์ใหม่ไม่นำกลับมา ส่วนข้อ 29, 54 และ 93 มีหมายเหตุตรวจสอบแยกหลังตอบ เพราะเฉลยในเอกสารยังมีข้อขัดแย้ง คะแนนที่ระบุว่า “ตรงเฉลยเอกสาร” จึงไม่ใช่การยืนยันหลักเภสัชในข้อนั้น</p><p>ไม่พบข้อ 10 ในเอกสาร ข้อที่ไม่มีช้อยส์ครบยังใช้แบบคิดคำตอบเอง และข้อกำกวมที่ไม่ได้กำหนดเฉลยใหม่ใช้ทบทวนโดยไม่คิดคะแนน</p><h3>รายการแหล่งตรวจสอบที่ระบุในต้นฉบับ</h3><p style="white-space:pre-wrap">${esc(DATA.references)}</p></details>`;$('filter').value=filter;$('filter').onchange=e=>filter=e.target.value;$('startAll').onclick=()=>start(null);if($('resume'))$('resume').onclick=()=>{screen='quiz';render()};$('app').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>start(Number(b.dataset.ch)));}
function render(){if(screen==='home'){home();return}if(screen==='result'){results();return}const q=current(),a=state.answers[q.id],done=state.ids.filter(id=>state.answers[id]).length,mcqs=state.ids.map(item).filter(x=>x.type==='mcq'),right=mcqs.filter(x=>state.answers[x.id]?.correct).length;nav();$('app').innerHTML=`<div class="row between"><span class="tag">${String(q.chapter+1).padStart(2,'0')} · ${esc(DATA.chapters[q.chapter])}</span><span class="small muted">${state.pos+1} / ${state.ids.length}</span></div><div class="progress" role="progressbar" aria-label="ทำแล้ว" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${state.ids.length}"><div style="width:${done/state.ids.length*100}%"></div></div><div class="row between small muted"><span>ทำแล้ว ${done} รายการ</span><span>คะแนนปรนัยตามเอกสาร ${right} / ${mcqs.length}</span></div><article class="card"><div class="row between"><span class="small muted">${esc(q.source)} · ${esc(q.origin)}</span><span class="tag">${q.type==='mcq'?(q.keyed?'ปรนัย · ตามเฉลยเอกสาร':'ปรนัย · ตรวจอัตโนมัติ'):q.type==='recall'?'คิดคำตอบเอง':'ทบทวน · ไม่คิดคะแนน'}</span></div><h2 id="question">${esc(q.question)}</h2>${q.type==='mcq'?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice ${a?(i===q.correct?'correct':i===a.selected?'wrong':''):''}" data-choice="${i}" ${a?'disabled':''}><span class="letter">${'ABCDE'[i]}</span><span>${esc(c)}${a&&i===q.correct?' ✓':a&&i===a.selected?' ✕':''}</span></button>`).join('')}</div>`:`${q.choices.length?'<div class="small">'+q.choices.map((c,i)=>`<p>${'ABCDE'[i]}. ${esc(c)}</p>`).join('')+'</div>':''}<p class="small muted">${q.type==='recall'?'ลองคิดหรือพิมพ์คำตอบก่อนเปิดเฉลย ไม่มีการตรวจข้อความอัตโนมัติ':'ต้นฉบับมีข้อมูลไม่ครบ หรือไม่เหมาะให้ตัดสินถูกผิดเพียงข้อเดียว'}</p><textarea id="draft" aria-label="คำตอบหรือบันทึกของคุณ" placeholder="คำตอบหรือบันทึกของคุณ…">${esc(state.drafts[q.id]||'')}</textarea>${!a?'<button class="primary" id="reveal" style="margin-top:12px">เปิดเฉลยและคำอธิบาย</button>':''}`}${a?`<section class="feedback" aria-live="polite"><h3>${q.type==='mcq'?(a.correct?(q.keyed?'ตรงเฉลยเอกสาร':'ถูกต้อง'):(q.keyed?'ไม่ตรงเฉลยเอกสาร':'ยังไม่ถูก')):q.type==='review'?'อ่านหมายเหตุต้นฉบับ':'เทียบกับคำตอบของคุณ'}</h3><strong>${q.keyed?'เฉลยตามเอกสาร:':'เฉลย:'} ${esc(q.answer)}</strong><p>${esc(q.explanation)}</p>${q.verification?`<div class="notice"><strong>หมายเหตุตรวจสอบ — แยกจากเฉลยเอกสาร</strong><p>${esc(q.verification)}</p><a href="${esc(q.verificationUrl)}" target="_blank" rel="noopener noreferrer">${esc(q.verificationLabel)}</a></div>`:''}${q.type==='recall'?`<p class="small muted">ประเมินตนเอง — แยกจากคะแนนปรนัยตามเอกสาร</p><div class="row"><button id="remember" ${a.self!==undefined?'disabled':''}>${a.self===true?'✓ ':''}ตอบได้</button><button id="forget" ${a.self!==undefined?'disabled':''}>${a.self===false?'✓ ':''}ยังจำไม่ได้</button></div>`:''}</section>`:''}<p class="notice">เฉลยและคำอธิบายตามเอกสาร Word ที่แนบ · ข้อแก้เฉลยระบุแยกชัดเจน${q.type==='review'?' · รายการนี้ไม่รวมในคะแนน':''}</p></article><div class="nav"><button id="prev" ${state.pos===0?'disabled':''}>ก่อนหน้า</button><button id="summary" class="quiet">ดูความคืบหน้า / คะแนน</button><button id="next" class="primary">${state.pos===state.ids.length-1?'ดูคะแนนรวม':'ข้อถัดไป'}</button></div><details id="navigator"><summary>ข้ามไปข้ออื่น · ทำตามลำดับใดก็ได้</summary><div class="navgrid">${state.ids.map((id,i)=>{const ans=state.answers[id];return `<button data-go="${i}" aria-label="ข้อ ${i+1} ${ans?'ทำแล้ว':'ยังไม่ทำ'}" class="${i===state.pos?'here ':''}${ans?(ans.correct===false||ans.self===false?'miss':'done'):''}">${i+1}</button>`}).join('')}</div></details>`;
$('app').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(state.answers[q.id])return;const selected=Number(b.dataset.choice);state.answers[q.id]={selected,correct:selected===q.correct};save();render()});if($('draft'))$('draft').oninput=e=>{state.drafts[q.id]=e.target.value;save()};if($('reveal'))$('reveal').onclick=()=>{state.answers[q.id]={revealed:true};save();render()};for(const [id,v] of [['remember',true],['forget',false]])if($(id))$(id).onclick=()=>{state.answers[q.id].self=v;save();render()};$('prev').onclick=()=>go(state.pos-1);$('next').onclick=()=>{if(state.pos<state.ids.length-1)go(state.pos+1);else{screen='result';render();window.scrollTo(0,0)}};$('summary').onclick=()=>{screen='result';render();window.scrollTo(0,0)};$('app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));}
function go(p){state.pos=Math.max(0,Math.min(p,state.ids.length-1));save();render();window.scrollTo(0,0)}
function results(){const xs=state.ids.map(item),mcq=xs.filter(x=>x.type==='mcq'),answered=mcq.filter(x=>state.answers[x.id]),right=answered.filter(x=>state.answers[x.id].correct).length,recall=xs.filter(x=>x.type==='recall'),rated=recall.filter(x=>state.answers[x.id]?.self!==undefined),remember=rated.filter(x=>state.answers[x.id].self).length,wrong=xs.filter(x=>state.answers[x.id]?.correct===false||state.answers[x.id]?.self===false),missing=xs.filter(x=>!state.answers[x.id]||(x.type==='recall'&&state.answers[x.id].self===undefined)),complete=missing.length===0,pct=mcq.length?Math.round(right/mcq.length*100):null;let title=complete?'จบชุดนี้แล้ว.':'ความคืบหน้าของคุณ';$('app').innerHTML=`<span class="tag">SESSION REPORT</span><h1>${title}</h1><div class="card"><p class="muted">คะแนนปรนัยตามเอกสาร ${complete?'':'(ระหว่างทำ)'}</p><div class="meter">${right}<span style="font-size:26px;color:var(--muted)"> / ${mcq.length}</span></div><p>${pct===null?'ชุดนี้ไม่มีข้อปรนัย':pct+'% · '+(complete?(pct>=80?'เข้าใจเนื้อหาได้ดีมาก':pct>=60?'พื้นฐานดี ทบทวนบางหัวข้อเพิ่ม':'ทบทวนเนื้อหาหลักแล้วลองอีกครั้ง'):'ยังมีรายการที่ทำไม่ครบ')}</p><p class="small muted">ตอบปรนัยแล้ว ${answered.length} / ${mcq.length} ข้อ · ผิด ${answered.length-right} ข้อ · ยังไม่ตอบ ${mcq.length-answered.length} ข้อ</p><p>ประเมินตนเอง: จำได้ ${remember} / ${rated.length} รายการที่ประเมินแล้ว (ทั้งหมด ${recall.length} รายการ)</p><p class="small muted">รายการทบทวนไม่รวมคะแนน · คิดคำตอบเองไม่รวมเปอร์เซ็นต์ปรนัย</p><div class="row"><button class="primary" id="continue">กลับไปทำต่อ</button><button id="retry" ${wrong.length?'':'disabled'}>ทำซ้ำข้อผิด / ยังจำไม่ได้ (${wrong.length})</button><button id="restart">เริ่มชุดเดิมใหม่</button></div></div><div class="card"><h3>ผลแยกบท</h3>${DATA.chapters.map((c,i)=>{const chapter=xs.filter(x=>x.chapter===i);if(!chapter.length)return '';const quiz=chapter.filter(x=>x.type==='mcq'),r=quiz.filter(x=>state.answers[x.id]?.correct).length,w=chapter.filter(x=>state.answers[x.id]?.correct===false||state.answers[x.id]?.self===false).length;return `<div class="results-row"><div><strong>${esc(c)}</strong><div class="small muted">ปรนัย ${r} / ${quiz.length} · ควรทบทวน ${w} รายการ</div></div><button class="small" data-review="${i}">กลับไปบทนี้</button></div>`}).join('')}</div>`;$('continue').onclick=()=>{screen='quiz';if(missing.length)state.pos=state.ids.indexOf(missing[0].id);save();render()};$('retry').onclick=()=>start(state.chapter,wrong.map(x=>x.id));$('restart').onclick=()=>start(state.chapter,state.ids.slice());$('app').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.pos=state.ids.findIndex(id=>item(id).chapter===Number(b.dataset.review));screen='quiz';save();render()});}
$('homeBtn').onclick=home;$('menu').onclick=()=>$('sidebar').classList.toggle('open');function theme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'โหมดสว่าง':'โหมดมืด';write('pharmaco-theme',t)}theme(read('pharmaco-theme')||'light');$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.addEventListener('keydown',e=>{if(screen!=='quiz'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}else if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}else if(/^[a-e1-5]$/i.test(e.key)){const n=/\d/.test(e.key)?Number(e.key)-1:e.key.toUpperCase().charCodeAt(0)-65;const b=$('app').querySelector(`[data-choice="${n}"]`);if(b&&!b.disabled)b.click();}});home();
</script></body></html>
